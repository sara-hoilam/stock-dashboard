function paintPrices(){
  const row = document.getElementById("pricerow");
  if (!row || !PRICE.bars.length) return;
  row.hidden = false;
  // The row may be empty (the market-only view) or showing a waiting note.
  // Either way it needs its chart and panel back before anything is drawn.
  restorePriceRow();

  const ranges = document.getElementById("price-ranges");
  ranges.innerHTML = RANGES.map(([lab, n]) =>
    `<button data-n="${n}" aria-pressed="${PRICE.range === n && !PRICE.view}">${lab}</button>`).join("");
  ranges.querySelectorAll("button").forEach(b =>
    b.onclick = () => { PRICE.range = +b.dataset.n; PRICE.view = null; paintPrices(); });

  // The indicator and interval menus are rebuilt with the panel, so their
  // ticked state always matches what is actually drawn.
  const tools = document.getElementById("price-tools");
  if (tools) { tools.innerHTML = chartToolbar(); wireToolbar(); }

  wirePriceFullscreen();
  drawPriceStats();          // sets the caption the crosshair restores
  drawCandles();

  // Three of the panels below are drawn from these bars. Prices arrive after
  // the first render, so whichever of the two finishes last does the drawing.
  marketPanels();
}

/** The panels that need both the extras payload and the price bars. */
function marketPanels(){
  if (!EXTRA.data || !(PRICE.bars || []).length) return;
  if (!document.getElementById("bench-chart")) return;
  document.getElementById("extras").hidden = false;
  drawBenchmark();
  drawPE();
  wireHelp();
}

/** Index window over PRICE.bars for the active range button. */
function baseWindow(){
  const n = PRICE.range, len = PRICE.bars.length;
  if (n > 0 && len > n) return { a: len - n, b: len };
  return { a: 0, b: len };
}


/* ===========================================================================
   Technical analysis

   Overlays drawn on the price chart itself, grouped the way a trader thinks
   about them rather than as one long list. Every one is computed here from the
   OHLCV already on the page -- no indicator endpoint is called, so adding one
   costs nothing and they all agree with the candles they sit on.
=========================================================================== */

/** Daily bars folded into weeks or months. The daily series is the only one
    stored, so longer intervals are made rather than fetched. */
function resample(bars, interval){
  if (interval === "daily" || !bars.length) return bars;
  const key = b => interval === "weekly"
    // ISO-ish week key: the Thursday of the week keeps years from splitting.
    ? (() => { const d = new Date(b.d + "T00:00:00Z");
               d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
               return d.toISOString().slice(0, 10); })()
    : b.d.slice(0, 7);
  const out = [];
  let cur = null, k = null;
  for (const b of bars) {
    const bk = key(b);
    if (bk !== k) {
      if (cur) out.push(cur);
      k = bk;
      cur = { d: b.d, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v || 0 };
    } else {
      cur.h = Math.max(cur.h ?? b.h, b.h ?? cur.h);
      cur.l = Math.min(cur.l ?? b.l, b.l ?? cur.l);
      cur.c = b.c;
      cur.d = b.d;                        // label the period by its last day
      cur.v = (cur.v || 0) + (b.v || 0);
    }
  }
  if (cur) out.push(cur);
  return out;
}

/* ---- the maths ----------------------------------------------------------- */
const sma = (xs, n) => xs.map((_, i) =>
  i < n - 1 ? null : xs.slice(i - n + 1, i + 1).reduce((a, v) => a + v, 0) / n);

function ema(xs, n){
  const k = 2 / (n + 1), out = [];
  let prev = null;
  xs.forEach((v, i) => {
    if (i < n - 1) { out.push(null); return; }
    if (prev === null) {
      prev = xs.slice(0, n).reduce((a, x) => a + x, 0) / n;
    } else {
      prev = v * k + prev * (1 - k);
    }
    out.push(prev);
  });
  return out;
}

const stdev = (xs, n) => xs.map((_, i) => {
  if (i < n - 1) return null;
  const w = xs.slice(i - n + 1, i + 1);
  const m = w.reduce((a, v) => a + v, 0) / n;
  return Math.sqrt(w.reduce((a, v) => a + (v - m) ** 2, 0) / n);
});

/** True range, which Keltner and ADX both need. */
const trueRange = bars => bars.map((b, i) => {
  const pc = i ? bars[i - 1].c : b.o ?? b.c;
  return Math.max(b.h - b.l, Math.abs(b.h - pc), Math.abs(b.l - pc));
});

/* ---- the catalogue ------------------------------------------------------- */
// Each entry returns lines and bands in price units; the chart scales them
// with the candles, so an indicator never needs to know the geometry.
const TA = {
  trend: {
    label: "Trend",
    items: {
      ma: { name: "Moving Averages (20/50/200)", fn: bars => {
        const c = bars.map(b => b.c);
        return { lines: [
          { pts: sma(c, 20),  colour: "#2f7dff", name: "20" },
          { pts: sma(c, 50),  colour: "#f0952a", name: "50" },
          { pts: sma(c, 200), colour: "#a855f7", name: "200" },
        ] };
      }},
      ribbon: { name: "EMA Ribbon", fn: bars => {
        const c = bars.map(b => b.c);
        // Compression means the short and long horizons agree; expansion is a
        // trend taking hold. Eight strands read as a band, not eight lines.
        const periods = [8, 13, 21, 34, 55, 89];
        return { lines: periods.map((n, i) => ({
          pts: ema(c, n), name: String(n),
          colour: `hsl(${210 + i * 12} 85% ${62 - i * 5}%)`, thin: true,
        })) };
      }},
      ichimoku: { name: "Ichimoku Cloud", fn: bars => {
        const hi = (n, i) => Math.max(...bars.slice(Math.max(0, i - n + 1), i + 1).map(b => b.h));
        const lo = (n, i) => Math.min(...bars.slice(Math.max(0, i - n + 1), i + 1).map(b => b.l));
        const mid = n => bars.map((_, i) => i < n - 1 ? null : (hi(n, i) + lo(n, i)) / 2);
        const tenkan = mid(9), kijun = mid(26);
        // Both spans are plotted 26 ahead in a real Ichimoku; shifting inside
        // a fixed window would cut the right edge off, so they are drawn in
        // place and the shift is noted in the key.
        const spanA = bars.map((_, i) =>
          tenkan[i] === null || kijun[i] === null ? null : (tenkan[i] + kijun[i]) / 2);
        const spanB = mid(52);
        return {
          lines: [{ pts: tenkan, colour: "#2f7dff", name: "Tenkan 9" },
                  { pts: kijun, colour: "#a855f7", name: "Kijun 26" }],
          cloud: { a: spanA, b: spanB, up: "#16c78433", down: "#ea394333" },
        };
      }},
    },
  },
  volatility: {
    label: "Volatility",
    items: {
      bollinger: { name: "Bollinger Bands (20, 2σ)", fn: bars => {
        const c = bars.map(b => b.c);
        const m = sma(c, 20), sd = stdev(c, 20);
        const up = m.map((v, i) => v === null ? null : v + 2 * sd[i]);
        const dn = m.map((v, i) => v === null ? null : v - 2 * sd[i]);
        return { lines: [{ pts: m, colour: "#a855f7", name: "20 SMA", dash: true }],
                 band: { hi: up, lo: dn, colour: "#a855f733", name: "±2σ" } };
      }},
      keltner: { name: "Keltner Channels (20, 2 ATR)", fn: bars => {
        const c = bars.map(b => b.c);
        const mid = ema(c, 20), atr = sma(trueRange(bars), 20);
        const up = mid.map((v, i) => v === null || atr[i] === null ? null : v + 2 * atr[i]);
        const dn = mid.map((v, i) => v === null || atr[i] === null ? null : v - 2 * atr[i]);
        return { lines: [{ pts: mid, colour: "#16a3c7", name: "20 EMA", dash: true }],
                 band: { hi: up, lo: dn, colour: "#16a3c733", name: "±2 ATR" } };
      }},
      donchian: { name: "Donchian Channels (20)", fn: bars => {
        const up = bars.map((_, i) => i < 19 ? null
          : Math.max(...bars.slice(i - 19, i + 1).map(b => b.h)));
        const dn = bars.map((_, i) => i < 19 ? null
          : Math.min(...bars.slice(i - 19, i + 1).map(b => b.l)));
        const mid = up.map((v, i) => v === null ? null : (v + dn[i]) / 2);
        return { lines: [{ pts: mid, colour: "#f0952a", name: "Midline", dash: true }],
                 band: { hi: up, lo: dn, colour: "#f0952a2b", name: "20-day high/low" } };
      }},
    },
  },
  structure: {
    label: "Structure",
    items: {
      fib: { name: "Fibonacci Retracement", fn: bars => {
        const hi = Math.max(...bars.map(b => b.h));
        const lo = Math.min(...bars.map(b => b.l));
        const span = hi - lo;
        // Measured across the window on screen, so changing the range moves
        // the levels -- which is how a retracement is actually read.
        return { levels: [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1].map(f => ({
          v: hi - span * f,
          name: f === 0 ? "High" : f === 1 ? "Low" : `${(f * 100).toFixed(1)}%`,
          colour: f === 0 || f === 1 ? "var(--ink-3)" : "#d4a017",
        })) };
      }},
      pivots: { name: "Pivot Points (classic)", fn: bars => {
        // From the last completed period, which is what the next session
        // trades against.
        const b = bars[bars.length - 2] || bars[bars.length - 1];
        if (!b) return {};
        const p = (b.h + b.l + b.c) / 3;
        return { levels: [
          { v: p + (p - b.l),          name: "R2", colour: "#ea3943" },
          { v: 2 * p - b.l,            name: "R1", colour: "#ea394399" },
          { v: p,                      name: "P",  colour: "var(--ink-3)" },
          { v: 2 * p - b.h,            name: "S1", colour: "#16c78499" },
          { v: p - (b.h - p),          name: "S2", colour: "#16c784" },
        ] };
      }},
      vwap: { name: "VWAP (anchored to window)", fn: bars => {
        let pv = 0, vol = 0;
        const pts = bars.map(b => {
          const typical = ((b.h ?? b.c) + (b.l ?? b.c) + b.c) / 3;
          pv += typical * (b.v || 0); vol += (b.v || 0);
          return vol ? pv / vol : null;
        });
        return { lines: [{ pts, colour: "#e0a92e", name: "VWAP" }] };
      }},
    },
  },
};

/* ---- state --------------------------------------------------------------- */
PRICE.interval = "daily";
PRICE.active = new Set();

const INTERVALS = [["Daily", "daily"], ["Weekly", "weekly"], ["Monthly", "monthly"]];

/** The two dropdown groups above the chart. */
function chartToolbar(){
  const menu = (id, label, body) => `
    <div class="tmenu" data-menu="${id}">
      <button type="button" class="tbtn" aria-expanded="false">${esc(label)}
        <svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none"
          stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <div class="tpop">${body}</div>
    </div>`;

  const timeBody = INTERVALS.map(([lab, v]) =>
    `<button type="button" data-interval="${v}"
       class="${PRICE.interval === v ? "on" : ""}">${lab}</button>`).join("");

  const groups = Object.entries(TA).map(([gid, g]) =>
    menu(gid, g.label, `<div class="tpop-h">${esc(g.label)}</div>` +
      Object.entries(g.items).map(([id, it]) =>
        `<button type="button" data-ta="${id}"
           class="${PRICE.active.has(id) ? "on" : ""}">${esc(it.name)}</button>`).join(""))).join("");

  const anyOn = PRICE.active.size > 0;
  return menu("time", "Time", `<div class="tpop-h">Interval</div>${timeBody}`) + groups +
    `<button type="button" class="tbtn ${anyOn ? "" : "off"}" data-ta-clear
       ${anyOn ? "" : "disabled"}>Clear</button>`;
}

function wireToolbar(){
  const bar = document.getElementById("price-tools");
  if (!bar) return;
  bar.querySelectorAll(".tmenu").forEach(m => {
    const btn = m.querySelector(".tbtn");
    btn.onclick = e => {
      e.stopPropagation();
      const open = m.classList.contains("open");
      bar.querySelectorAll(".tmenu").forEach(x => x.classList.remove("open"));
      m.classList.toggle("open", !open);
      btn.setAttribute("aria-expanded", String(!open));
    };
  });
  document.addEventListener("click", () =>
    bar.querySelectorAll(".tmenu").forEach(m => m.classList.remove("open")));

  bar.querySelectorAll("[data-interval]").forEach(b => b.onclick = () => {
    PRICE.interval = b.dataset.interval;
    paintPrices();
  });
  bar.querySelectorAll("[data-ta]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const id = b.dataset.ta;
    PRICE.active.has(id) ? PRICE.active.delete(id) : PRICE.active.add(id);
    paintPrices();
  });
  const clear = bar.querySelector("[data-ta-clear]");
  if (clear) clear.onclick = () => { PRICE.active.clear(); paintPrices(); };
}

/** Every active overlay, resolved against the bars on screen. */
function activeOverlays(bars){
  const out = [];
  for (const [, g] of Object.entries(TA)) {
    for (const [id, it] of Object.entries(g.items)) {
      if (!PRICE.active.has(id)) continue;
      try { out.push({ id, name: it.name, ...it.fn(bars) }); }
      catch (e) { console.error("[ta]", id, e); }
    }
  }
  return out;
}

function visibleBars(){
  if (PRICE.view) {
    const a = Math.max(0, Math.min(PRICE.view.a, PRICE.bars.length - 2));
    const b = Math.max(a + 5, Math.min(PRICE.view.b, PRICE.bars.length));
    return PRICE.bars.slice(a, b);
  }
  const n = PRICE.range;
  return n > 0 ? PRICE.bars.slice(-n) : PRICE.bars;
}

/** Pinch/pan state lives outside drawCandles so a redraw mid-gesture does not
    drop the fingers that are still on the screen. */
const PZOOM = { pinch: null, pan: null, lastTap: 0, timer: 0, gesturing: false, geom: null };

function setPriceView(a, b){
  const len = PRICE.bars.length;
  a = Math.max(0, Math.min(a, len - 5));
  b = Math.max(a + 5, Math.min(b, len));
  const base = baseWindow();
  PRICE.view = (a <= base.a && b >= base.b) ? null : { a, b };
  const ranges = document.getElementById("price-ranges");
  if (ranges) ranges.querySelectorAll("button").forEach(btn => {
    btn.setAttribute("aria-pressed",
      PRICE.view ? "false" : String(+btn.dataset.n === PRICE.range));
  });
  clearTimeout(PZOOM.timer);
  PZOOM.timer = setTimeout(() => drawCandles(), 16);
}

function wirePriceGestures(host){
  if (host.dataset.gestures === "1") return;
  host.dataset.gestures = "1";

  const win = () => PRICE.view ? { ...PRICE.view } : baseWindow();

  host.addEventListener("touchstart", e => {
    if (!PZOOM.geom || !PRICE.bars.length) return;
    const { svg, tip, cross } = PZOOM.geom;
    if (e.touches.length === 2) {
      e.preventDefault();
      PZOOM.gesturing = true;
      if (tip) tip.hidden = true;
      if (cross) cross.style.display = "none";
      const d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
      const r = svg.getBoundingClientRect();
      const midX = ((e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left) / r.width;
      PZOOM.pinch = { d, midX, ...win() };
      PZOOM.pan = null;
    } else if (e.touches.length === 1) {
      const now = Date.now();
      if (now - PZOOM.lastTap < 280) {
        PRICE.view = null;
        const ranges = document.getElementById("price-ranges");
        if (ranges) ranges.querySelectorAll("button").forEach(btn => {
          btn.setAttribute("aria-pressed", String(+btn.dataset.n === PRICE.range));
        });
        drawCandles();
        PZOOM.lastTap = 0;
        return;
      }
      PZOOM.lastTap = now;
      const cur = win();
      const base = baseWindow();
      if (cur.b - cur.a < base.b - base.a) {
        PZOOM.pan = { x: e.touches[0].clientX, ...cur };
        PZOOM.gesturing = true;
      } else {
        PZOOM.gesturing = false;
        if (PZOOM.geom.showAt) PZOOM.geom.showAt(e.touches[0].clientX, e.touches[0].clientY);
      }
    }
  }, { passive: false });

  host.addEventListener("touchmove", e => {
    if (!PZOOM.geom || !PRICE.bars.length) return;
    const { svg } = PZOOM.geom;
    if (e.touches.length === 2 && PZOOM.pinch) {
      e.preventDefault();
      PZOOM.gesturing = true;
      const d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
      const scale = PZOOM.pinch.d / Math.max(24, d);
      const span0 = PZOOM.pinch.b - PZOOM.pinch.a;
      const maxSpan = baseWindow().b - baseWindow().a;
      const span = Math.max(5, Math.min(maxSpan, Math.round(span0 * scale)));
      const focus = PZOOM.pinch.a + PZOOM.pinch.midX * span0;
      setPriceView(Math.round(focus - span * PZOOM.pinch.midX),
                   Math.round(focus - span * PZOOM.pinch.midX + span));
    } else if (e.touches.length === 1 && PZOOM.pan) {
      e.preventDefault();
      PZOOM.gesturing = true;
      const r = svg.getBoundingClientRect();
      const span = PZOOM.pan.b - PZOOM.pan.a;
      const dx = (e.touches[0].clientX - PZOOM.pan.x) / r.width * span;
      setPriceView(Math.round(PZOOM.pan.a - dx), Math.round(PZOOM.pan.b - dx));
    } else if (e.touches.length === 1 && !PZOOM.gesturing && PZOOM.geom.showAt) {
      PZOOM.geom.showAt(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: false });

  host.addEventListener("touchend", e => {
    if (e.touches.length < 2) PZOOM.pinch = null;
    if (e.touches.length === 0) {
      PZOOM.pan = null;
      PZOOM.gesturing = false;
      if (PZOOM.geom && PZOOM.geom.tip) PZOOM.geom.tip.hidden = true;
      if (PZOOM.geom && PZOOM.geom.cross) PZOOM.geom.cross.style.display = "none";
    }
  });
}

function drawCandles(){
  const host = document.getElementById("price-chart");
  if (!host) return;
  const bars = resample(visibleBars(), PRICE.interval);
  if (!bars.length) { host.innerHTML = ""; PZOOM.geom = null; return; }

  const mobile = MOBILE_MQ.matches || document.body.classList.contains("chart-fs-open");
  const W = 900;
  const H = document.body.classList.contains("chart-fs-open") ? 640
          : mobile ? 520 : 330;
  const VH = mobile ? 78 : 58;          // of which VH is the volume band
  const ml = 8, mr = mobile ? 48 : 56, mt = 10, mb = 22;
  const pw = W - ml - mr, ph = H - mt - mb - VH - 12;

  const lo = Math.min(...bars.map(b => b.l ?? b.c));
  const hi = Math.max(...bars.map(b => b.h ?? b.c));
  const pad = (hi - lo) * 0.06 || 1;
  const y0 = lo - pad, y1 = hi + pad;
  const y = v => mt + ph - (v - y0) / (y1 - y0) * ph;

  const vmax = Math.max(...bars.map(b => b.v || 0)) || 1;
  const vy = v => H - mb - (v / vmax) * VH;

  const step = pw / bars.length;
  const bw = Math.max(1, Math.min(9, step * 0.62));
  const x = i => ml + step * (i + 0.5);
  const col = b => (b.c ?? 0) >= (b.o ?? b.c ?? 0) ? "var(--up)" : "var(--down)";

  const candles = bars.map((b, i) => {
    const top = y(Math.max(b.o ?? b.c, b.c)), bot = y(Math.min(b.o ?? b.c, b.c));
    return `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}"
              y1="${y(b.h ?? b.c).toFixed(1)}" y2="${y(b.l ?? b.c).toFixed(1)}"
              stroke="${col(b)}" stroke-width="1"/>
            <rect x="${(x(i) - bw / 2).toFixed(1)}" y="${top.toFixed(1)}"
              width="${bw.toFixed(1)}" height="${Math.max(1, bot - top).toFixed(1)}"
              fill="${col(b)}"/>`;
  }).join("");

  const vols = bars.map((b, i) =>
    `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${vy(b.v || 0).toFixed(1)}"
       width="${bw.toFixed(1)}" height="${(H - mb - vy(b.v || 0)).toFixed(1)}"
       fill="${col(b)}" opacity=".26"/>`).join("");

  // Overlays replace the old fixed 50-day line: the same information is now
  // one option among many rather than the only one on offer.
  const overlays = activeOverlays(bars);
  const path = pts => pts.map((v, i) => v === null || v === undefined ? null
      : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(" ");

  const taSvg = overlays.map(o => {
    let out = "";
    if (o.band) {
      // Down the upper edge and back along the lower: one shape, so a squeeze
      // reads as the gap closing rather than two lines converging.
      const top = o.band.hi.map((v, i) => v === null ? null
        : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean);
      const bot = o.band.lo.map((v, i) => v === null ? null
        : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).reverse();
      if (top.length) out += `<polygon points="${top.concat(bot).join(" ")}"
        fill="${o.band.colour}"/>`;
      [o.band.hi, o.band.lo].forEach(edge => {
        const d = path(edge);
        if (d) out += `<polyline points="${d}" fill="none"
          stroke="${o.band.colour.slice(0, 7)}" stroke-width="1.2" opacity=".85"/>`;
      });
    }
    if (o.cloud) {
      // Shaded green where the leading span is above the lagging one, red
      // below -- the colour is the signal, not decoration.
      for (let i = 1; i < o.cloud.a.length; i++) {
        const a0 = o.cloud.a[i - 1], b0 = o.cloud.b[i - 1];
        const a1 = o.cloud.a[i], b1 = o.cloud.b[i];
        if ([a0, b0, a1, b1].some(v => v === null || v === undefined)) continue;
        out += `<polygon points="${x(i-1).toFixed(1)},${y(a0).toFixed(1)} `
             + `${x(i).toFixed(1)},${y(a1).toFixed(1)} `
             + `${x(i).toFixed(1)},${y(b1).toFixed(1)} `
             + `${x(i-1).toFixed(1)},${y(b0).toFixed(1)}"
               fill="${a1 >= b1 ? o.cloud.up : o.cloud.down}"/>`;
      }
    }
    (o.lines || []).forEach(l => {
      const d = path(l.pts);
      if (d) out += `<polyline points="${d}" fill="none" stroke="${l.colour}"
        stroke-width="${l.thin ? 1 : 1.5}"
        ${l.dash ? 'stroke-dasharray="5 4"' : ""} opacity=".92"/>`;
    });
    (o.levels || []).forEach(lv => {
      if (lv.v < y0 || lv.v > y1) return;
      out += `<line x1="${ml}" x2="${W - mr}" y1="${y(lv.v).toFixed(1)}"
        y2="${y(lv.v).toFixed(1)}" stroke="${lv.colour}" stroke-width="1"
        stroke-dasharray="4 4" opacity=".9"/>
        <text x="${ml + 4}" y="${(y(lv.v) - 3).toFixed(1)}" class="ax"
          fill="${lv.colour}">${esc(lv.name)}</text>`;
    });
    return out;
  }).join("");

  const ticks = bandTicks(y0, y1, 5);
  const grid = ticks.map(t => `
    <line x1="${ml}" x2="${W - mr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"
      stroke="var(--rule-2)" stroke-width="1"/>
    <text x="${W - mr + 7}" y="${(y(t) + 3.5).toFixed(1)}" class="ax">${t < 10 ? t.toFixed(2) : Math.round(t)}</text>`).join("");

  // Dates at a readable density, whatever the range.
  const every = Math.max(1, Math.round(bars.length / 7));
  const dates = bars.map((b, i) => i % every === 0 && i < bars.length - every / 2
    ? `<text x="${x(i).toFixed(1)}" y="${H - 6}" class="ax mid">${shortDate(b.d)}</text>` : "")
    .join("");

  const keptTip = document.getElementById("ptip");
  host.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" class="pchart" role="img"
         aria-label="Daily prices for ${esc(PRICE.symbol)}"
         preserveAspectRatio="${mobile ? "none" : "xMidYMid meet"}">
      ${grid}${taSvg}${vols}${candles}
      ${dates}
      <g id="pcross" style="display:none">
        <line id="pcx" y1="${mt}" y2="${H - mb}" stroke="var(--ink-3)"
          stroke-width="1" stroke-dasharray="3 3"/>
        <line id="pcy" x1="${ml}" x2="${W - mr}" stroke="var(--ink-3)"
          stroke-width="1" stroke-dasharray="3 3"/>
      </g>
      <rect x="${ml}" y="0" width="${pw}" height="${H}" fill="transparent" id="phit"/>
    </svg>`;
  if (keptTip) {
    keptTip.hidden = true;
    host.appendChild(keptTip);
  }

  // Name what is drawn. An unlabelled line on a price chart is a guess.
  const key = document.getElementById("ta-key");
  if (key) {
    const bits = [];
    overlays.forEach(o => {
      (o.lines || []).forEach(l => bits.push(
        `<span><i style="background:${l.colour}"></i>${esc(o.name.split(" (")[0])} ${esc(l.name)}</span>`));
      if (o.band) bits.push(
        `<span><i style="background:${o.band.colour.slice(0,7)}"></i>${esc(o.band.name)}</span>`);
      if (o.cloud) bits.push(`<span><i style="background:#16c784"></i>Cloud</span>`);
      if (o.levels) bits.push(`<span><i style="background:#d4a017"></i>${esc(o.name.split(" (")[0])}</span>`);
    });
    key.innerHTML = bits.join("");
    key.hidden = !bits.length;
  }

  // Crosshair, with the day's numbers in a box at the crossing point. The box
  // is placed on whichever side of the pointer has room, so it never runs off
  // the panel or covers the candle it is describing.
  const svg = host.querySelector("svg");
  const cross = host.querySelector("#pcross");
  const cx = host.querySelector("#pcx"), cy = host.querySelector("#pcy");
  const tip = document.getElementById("ptip");
  const hit = host.querySelector("#phit");

  const showAt = (clientX, clientY) => {
    if (!tip) return;
    const r = svg.getBoundingClientRect();
    const px = (clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(bars.length - 1, Math.round((px - ml) / step - 0.5)));
    const b = bars[i];

    cross.style.display = "";
    cx.setAttribute("x1", x(i)); cx.setAttribute("x2", x(i));
    cy.setAttribute("y1", y(b.c)); cy.setAttribute("y2", y(b.c));

    const f = v => v === null || v === undefined ? "—" : v.toFixed(2);
    const rising = (b.c ?? 0) >= (b.o ?? b.c ?? 0);
    tip.innerHTML =
      `<div class="ptip-h"><span class="ptip-dot ${rising ? "up" : "down"}"></span>` +
      `${esc(longDate(b.d))}</div>` +
      [["Open", f(b.o)], ["High", f(b.h)], ["Low", f(b.l)], ["Close", f(b.c)],
       ["Volume", compact(b.v || 0)]]
        .map(([k, v]) => `<div class="ptip-r"><span>${k}</span><b>${v}</b></div>`).join("");
    tip.hidden = false;

    // Viewbox units to on-screen pixels, so the box tracks the crossing point
    // however the chart has been scaled.
    const sx = r.width / W, sy = r.height / H;
    const hostBox = host.getBoundingClientRect();
    const left = r.left - hostBox.left + x(i) * sx;
    const top = r.top - hostBox.top + y(b.c) * sy;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = (left + 14 + tw > hostBox.width ? left - tw - 14 : left + 14) + "px";
    tip.style.top = Math.max(0, Math.min(hostBox.height - th, top - th / 2)) + "px";
  };

  PZOOM.geom = { svg, tip, cross, showAt };

  hit.addEventListener("pointermove", e => {
    if (PZOOM.gesturing || e.pointerType === "touch") return;
    showAt(e.clientX, e.clientY);
  });
  hit.addEventListener("pointerleave", () => {
    if (PZOOM.gesturing) return;
    cross.style.display = "none";
    if (tip) tip.hidden = true;
  });

  wirePriceGestures(host);
}

function drawPriceStats(){
  const q = PRICE.quote, bars = PRICE.bars;
  const last = bars[bars.length - 1];
  const host = document.getElementById("price-stats");
  const price = q && q.price !== null && q.price !== undefined ? q.price : last.c;
  const chg = q ? q.change : null;
  const chgPct = q ? q.change_pct : null;

  document.getElementById("price-sub").textContent =
    `Daily closes through ${longDate(last.d)} · market data, not from the filing`;

  // In the market-only view the heading may be the bare ticker, because the
  // company was never ingested and so has no stored name. The quote has one.
  const h1 = document.querySelector(".ident h1");
  if (h1 && q && q.name && h1.textContent.trim() === PRICE.symbol) h1.textContent = q.name;

  const n = (v, d = 2) => v === null || v === undefined ? "—" : v.toFixed(d);
  const rows = [
    ["Open", n(q && q.open)],
    ["Prev close", n(q && q.previous_close)],
    ["Day low", n(q && q.day_low)],
    ["Day high", n(q && q.day_high)],
    ["52wk low", n(q && q.year_low)],
    ["52wk high", n(q && q.year_high)],
    ["50d avg", n(q && q.avg_50)],
    ["200d avg", n(q && q.avg_200)],
    ["Volume", q && q.volume ? compact(q.volume) : "—"],
    ["Market cap", q && q.market_cap ? "$" + compact(q.market_cap) : "—"],
    ["Shares out", q && q.shares ? compact(q.shares) : "—"],
    // A company with no earnings has no P/E. That is a fact about the
    // company, not a gap in the data, so it says so.
    ["P/E (TTM)", q ? (q.pe ? n(q.pe, 1) : "Loss") : "—"],
    ["P/B", n(q && q.pb, 2)],
    ["Div yield", q && q.dividend_yield
      ? (q.dividend_yield * 100).toFixed(2) + "%" : "—"],
  ];
  const dirClass = (chgPct ?? 0) >= 0 ? "up" : "down";

  // The consensus belongs beside the price it is a call on, not only at the
  // bottom of the page. It may not have arrived yet; loadAnalyst redraws here
  // when it does.
  const call = consensusCall(ANALYST.data && ANALYST.data.consensus);

  host.innerHTML = `
    <div class="pqhead">
      <div class="pq">
        <div class="pq-price ${dirClass}">${n(price)}</div>
        ${chg === null || chg === undefined ? "" : `
          <span class="pq-pill ${dirClass}">${chg >= 0 ? "+" : ""}${n(chg)}</span>
          <span class="pq-pill ${dirClass}">${chgPct >= 0 ? "+" : ""}${n(chgPct)}%</span>`}
      </div>
      ${!call ? "" : `<div class="pq-call ${call.tone}"
        title="${call.n} of ${call.total} analysts covering ${esc(PRICE.symbol || "")} rate it ${call.word.toLowerCase()}">
        <b>${call.word}</b><span>${call.n}/${call.total} ratings</span>
      </div>`}
    </div>
    <dl class="pstats">
      ${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}
    </dl>
    <p class="pnote">Last trading day${q && q.exchange ? ` · ${esc(q.exchange)}` : ""}</p>
    ${consensusSummary(price)}`;
}

/** No ticker in the URL means the visitor arrived from the nav rather than
    from a link, so ask which company instead of picking one for them. */
function showHero(){
  document.getElementById("hero").hidden = false;
  main.hidden = true;
  document.body.classList.remove("mreport", "chart-fs-open", "sankey-fs-open");
  hqEl.value = "";
  hqEl.focus({ preventScroll: true });
}

addEventListener("popstate", () => {
  const t = new URLSearchParams(location.search).get("t");
  if (t) load(t); else showHero();
});

(function boot(){
  const start = new URLSearchParams(location.search).get("t");
  if (start) load(start); else showHero();
})();
</script>

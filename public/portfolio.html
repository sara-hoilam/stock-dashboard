<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticker Alpha — Portfolio</title>
<script src="config.js"></script>
<script src="analytics.js"></script>
<script type="module" src="clarity-init.js"></script>
<link rel="stylesheet" href="nav.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --ground:#eef0f3; --card:#ffffff; --sunk:#f6f7f9;
  --ink:#111820; --ink-2:#4a5866; --ink-3:#78889a;
  --rule:#dde2e8; --rule-2:#eaeef2;
  --accent:#1e4fbf; --accent-soft:#e6ecfb;
  --up:#0b7a4b; --down:#c0392e;
  --up-soft:#e3f4ec; --down-soft:#fbe9e7;
  --s1:#2a78d6; --s2:#38b0de; --s3:#1baf7a; --s4:#eda100; --s5:#f0c419; --s6:#eb6834;
  --shadow:0 1px 2px rgba(17,24,32,.06), 0 6px 20px -12px rgba(17,24,32,.22);
  --r:10px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:#0d1219; --card:#151c25; --sunk:#111821;
  --ink:#e7edf4; --ink-2:#a3b1c0; --ink-3:#77879a;
  --rule:#232d3a; --rule-2:#1c2531;
  --accent:#6e9bff; --accent-soft:#1a2740;
  --up:#38b37d; --down:#f0736a;
  --up-soft:#12291f; --down-soft:#2b1614;
  --s1:#3987e5; --s2:#4ec4e8; --s3:#199e70; --s4:#c98500; --s5:#e0b84a; --s6:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  background:var(--ground); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
main{max-width:var(--page,1680px);margin:0 auto;padding:26px 28px 72px}
.up{color:var(--up)} .down{color:var(--down)}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
/* Wider holdings table so MV/QTY + P/L columns fit without a horizontal scroll;
   chart gives up some width on the right. */
.split{display:grid;grid-template-columns:minmax(560px,1.35fr) minmax(280px,1fr);min-height:520px}
.note{padding:28px 20px;color:var(--ink-3);text-align:center}
.load{display:inline-block;width:14px;height:14px;border:2px solid var(--rule);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- empty state --------------------------------------------------------- */
.empty{
  min-height:min(70vh,640px);display:flex;align-items:center;justify-content:center;
  padding:40px 20px;position:relative;overflow:hidden;
}
.empty-bg{
  position:absolute;inset:0;pointer-events:none;opacity:.07;
  background:
    radial-gradient(circle at 12% 22%, var(--accent) 0 1px, transparent 1.5px),
    radial-gradient(circle at 78% 18%, var(--ink-2) 0 1px, transparent 1.5px),
    radial-gradient(circle at 88% 70%, var(--accent) 0 1px, transparent 1.5px),
    radial-gradient(circle at 18% 78%, var(--ink-2) 0 1px, transparent 1.5px);
  background-size:180px 140px;
}
.empty-card{position:relative;max-width:480px;width:100%;text-align:center}
.empty-card h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.empty-card .lead{color:var(--ink-3);font-size:14px;margin-bottom:22px;line-height:1.45}
.benefits{list-style:none;text-align:left;margin:0 auto 22px;max-width:400px;display:grid;gap:12px}
.benefits li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.benefits .ico{
  width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:14px;line-height:1}
.benefits b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px}
.benefits span{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.empty-actions{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.pf-search{
  position:relative;flex:1;display:flex;align-items:center;gap:8px;
  background:var(--sunk);border:1px solid var(--rule);border-radius:10px;padding:0 12px;
}
.pf-search svg{width:16px;height:16px;color:var(--ink-3);flex-shrink:0}
.pf-search input{
  flex:1;border:0;background:transparent;padding:12px 0;font:inherit;color:var(--ink);
  outline:none;min-width:0
}
.pf-ac{
  position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);
  border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);
  z-index:20;display:none;max-height:260px;overflow:auto;text-align:left
}
.pf-ac.open{display:block}
.pf-ac div{padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.pf-ac div:hover,.pf-ac div.on{background:var(--accent-soft)}
.pf-ac b{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--accent)}
.pf-ac span{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{
  border:0;border-radius:10px;padding:0 18px;font:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  white-space:nowrap;min-height:44px
}
/* Keep the CTA dark in both themes — --ink flips to light in dark mode,
   which washed the button out to near-white. */
.btn-primary{background:#111820;color:#fff}
.btn-primary:hover{opacity:.9}
:root[data-theme="dark"] .btn-primary{
  background:#243141;color:var(--ink);border:1px solid var(--rule);
}
:root[data-theme="dark"] .btn-primary:hover{background:#2c3a4d;opacity:1}
.btn-ghost{background:transparent;border:1px solid var(--rule);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.empty-foot{font-size:12px;color:var(--ink-3)}

/* ---- pulse / overview cards ---------------------------------------------- */
.sumhead{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:12px 24px;margin-bottom:12px;flex-wrap:wrap
}
.sumhead h2{font-size:15px;font-weight:600;letter-spacing:-.005em;margin:0}
.sumhead .sub{color:var(--ink-3);font-size:12.5px;margin-left:auto}
.pulse{
  display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);
  border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);
  margin-bottom:18px;overflow:hidden
}
.pulse .cell{padding:14px 16px;border-right:1px solid var(--rule);min-width:0}
.pulse .cell:last-child{border-right:0}
.pulse .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin-bottom:6px}
.pulse .v{font-family:"IBM Plex Sans",sans-serif;font-size:22px;font-weight:700;
  letter-spacing:-.02em;line-height:1.15}
.pulse .v .dim{color:var(--ink-3);font-weight:500;font-size:16px}
.pulse .chg{margin-top:6px;font-size:12.5px;font-weight:600}
.pulse .chg.up{color:var(--up)} .pulse .chg.down{color:var(--down)}
.pulse .chg.mut{color:var(--ink-3);font-weight:500}
.mut{color:var(--ink-3)}
.pulse .scale{margin-top:10px;height:6px;border-radius:99px;position:relative;
  background:linear-gradient(90deg,#1baf7a 0%,#eda100 50%,#c0392e 100%)}
.pulse .scale i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;
  background:var(--card);border:2px solid var(--ink);transform:translate(-50%,-50%);
  box-shadow:0 0 0 1px var(--rule)}
.donut-wrap{display:flex;align-items:center;gap:14px;margin-top:4px}
.donut{width:88px;height:52px;flex-shrink:0}
.donut-legend{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:11px;min-width:0}
.donut-legend span{display:flex;align-items:center;gap:5px;color:var(--ink-2);min-width:0}
.donut-legend i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.donut-legend b{font-family:"IBM Plex Mono",monospace;font-weight:500;margin-left:auto}

/* ---- split list + chart -------------------------------------------------- */
.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:14px 18px 10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;flex-shrink:0}
.seg button{background:transparent;border:0;padding:6px 11px;font:inherit;font-size:12px;
  cursor:pointer;color:var(--ink-2);border-right:1px solid var(--rule);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:500}
.rows{border-right:1px solid var(--rule);overflow-y:auto;overflow-x:auto;max-height:520px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;padding:8px 14px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:var(--card);z-index:1}
td{padding:10px 14px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
tr{cursor:pointer} tr:hover td{background:var(--sunk)}
tr.on td{background:var(--accent-soft)}
.tsym{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-decoration:none}
.tsym-t{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--accent);
  font-size:12.5px;line-height:1.25}
.tsym-n{font-size:10.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:130px;line-height:1.3}
.pill{display:inline-block;padding:2px 7px;border-radius:99px;font-size:11.5px;font-weight:600}
.pill.up{background:var(--up-soft);color:var(--up)}
.pill.down{background:var(--down-soft);color:var(--down)}
.row-actions{display:flex;gap:4px;flex-wrap:nowrap;align-items:center}
.row-actions button{
  border:1px solid var(--rule);background:var(--card);border-radius:6px;
  padding:3px 8px;font:inherit;font-size:11px;cursor:pointer;color:var(--ink-2);
  display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:26px
}
.row-actions button:hover{border-color:var(--accent);color:var(--accent)}
.row-actions .icon-btn{padding:3px 6px;color:var(--ink-3)}
.row-actions .icon-btn svg{width:13px;height:13px;display:block}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;align-items:center}
.modal-actions .grow{flex:1;display:flex;justify-content:flex-start}
.btn-danger{
  border:1px solid var(--down);background:transparent;color:var(--down);
  border-radius:10px;padding:0 12px;min-height:44px;font:inherit;font-size:13px;
  font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px
}
.btn-danger:hover{background:var(--down-soft)}
.btn-danger svg{width:15px;height:15px}
.btn-danger[hidden]{display:none}
.stack-cell{display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1.25}
.stack-cell.start{align-items:flex-start}
.stack-cell .top{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:12.5px;font-weight:600;color:var(--ink)}
.stack-cell .bot{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:10.5px;color:var(--ink-3)}
.stack-cell .bot.up{color:var(--up)}
.stack-cell .bot.down{color:var(--down)}
.stack-cell .top.up{color:var(--up)}
.stack-cell .top.down{color:var(--down)}
.rows table{font-size:12.5px}
.rows th,.rows td{padding:9px 10px;white-space:nowrap}
.rows th:first-child,.rows td:first-child{padding-left:14px}
.rows .idcol{white-space:normal}
.rows{overflow-x:auto}
.wl-bar{padding:10px 14px;border-bottom:1px solid var(--rule)}
.wl-search{
  position:relative;display:flex;align-items:center;gap:8px;
  background:var(--sunk);border:1px solid var(--rule);border-radius:8px;padding:0 10px
}
.wl-search svg{width:14px;height:14px;color:var(--ink-3)}
.wl-search input{flex:1;border:0;background:transparent;padding:9px 0;font:inherit;outline:none;color:var(--ink)}
.wl-ac{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);
  border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);z-index:15;display:none}
.wl-ac.open{display:block}
.wl-ac div{padding:8px 10px;cursor:pointer;display:flex;gap:8px}
.wl-ac div:hover{background:var(--accent-soft)}
.wl-ac b{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent)}
.wl-ac span{font-size:11.5px;color:var(--ink-3)}

.chartwrap{display:flex;flex-direction:column;min-width:0;padding:14px 16px 10px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.chead .price{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chead .price b{font-family:"IBM Plex Mono",monospace}
.chead .meta{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.chead .meta .up,.chead .meta .down{font-weight:600}
#chart{flex:1;min-height:360px}
.idx-bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 4px;border-top:1px solid var(--rule-2);margin-top:6px}
.idx-chip{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);
  border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;background:transparent;color:var(--ink-2)
}
.idx-chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.idx-chip i{width:8px;height:8px;border-radius:50%}
.range{display:flex;gap:4px}
.range button{
  border:1px solid var(--rule);background:transparent;border-radius:7px;
  padding:4px 9px;font:inherit;font-size:11.5px;cursor:pointer;color:var(--ink-2)
}
.range button[aria-pressed=true]{border-color:var(--ink);color:var(--ink);font-weight:600}

/* ---- modal --------------------------------------------------------------- */
.modal{
  position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:80;
  display:grid;place-items:center;padding:20px
}
.modal[hidden]{display:none}
.modal-card{
  background:var(--card);border:1px solid var(--rule);border-radius:14px;
  box-shadow:var(--shadow);width:min(440px,100%);padding:22px 22px 18px;position:relative
}
.modal-card h2{font-size:18px;font-weight:700;letter-spacing:-.015em;margin-bottom:4px}
.modal-card .sub{font-size:12.5px;color:var(--ink-3);margin-bottom:16px}
.modal-x{position:absolute;top:12px;right:12px;border:0;background:transparent;
  font-size:22px;line-height:1;cursor:pointer;color:var(--ink-3);padding:4px 8px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-3);
  letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.field input{
  width:100%;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;
  font:inherit;background:var(--sunk);color:var(--ink);outline:none
}
.field input:focus{border-color:var(--accent);background:var(--card)}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.err{color:var(--down);font-size:12.5px;margin-top:8px;min-height:1.2em}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;
  font-size:13px;z-index:90;box-shadow:var(--shadow)
}

@media (max-width:980px){
  .pulse{grid-template-columns:1fr 1fr}
  .pulse .cell:nth-child(2){border-right:0}
  .pulse .cell:nth-child(n+3){border-top:1px solid var(--rule)}
}
@media (max-width:720px){
  main{padding:16px 14px 56px}
  .empty-card h1{font-size:24px}
  .empty-actions{flex-direction:column}
  .pulse{grid-template-columns:1fr 1fr}
  .pulse .v{font-size:16px}
  .split{grid-template-columns:1fr;min-height:0}
  .rows{border-right:0;max-height:none}
  .chartwrap{display:none}
  .donut-wrap{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<main>
  <div id="app"><div class="note"><span class="load"></span></div></div>
</main>

<div class="modal" id="add-modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <button type="button" class="modal-x" id="add-x" aria-label="Close">×</button>
    <h2 id="add-title">Add to portfolio</h2>
    <p class="sub" id="add-sub">Enter your current holding as of today — ticker, quantity, and average buy price. P/L is calculated from live price.</p>
    <form id="add-form">
      <div class="field">
        <label for="f-symbol">Ticker</label>
        <input id="f-symbol" name="symbol" autocomplete="off" required maxlength="10" placeholder="e.g. AAPL">
      </div>
      <div class="field">
        <label for="f-date">Today's date</label>
        <input id="f-date" name="date" type="date" required>
      </div>
      <div class="field">
        <label for="f-qty">Quantity</label>
        <input id="f-qty" name="qty" type="number" step="any" min="0" required placeholder="Shares">
      </div>
      <div class="field">
        <label for="f-price">Average buy price per share</label>
        <input id="f-price" name="price" type="number" step="any" min="0" required placeholder="USD">
        <div class="hint" id="f-price-hint">Your cost basis per share from your brokerage.</div>
      </div>
      <div class="err" id="add-err"></div>
      <div class="modal-actions">
        <div class="grow">
          <button type="button" class="btn-danger" id="add-delete" hidden
                  aria-label="Delete holding">
            <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h12M8 6V4.5A1.5 1.5 0 0 1 9.5 3h1A1.5 1.5 0 0 1 12 4.5V6m-5 0v9.5A1.5 1.5 0 0 0 8.5 17h3a1.5 1.5 0 0 0 1.5-1.5V6M9 9v5M11 9v5"/>
            </svg>
            Delete
          </button>
        </div>
        <button type="button" class="btn btn-ghost" id="add-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="add-save">Add holding</button>
      </div>
    </form>
  </div>
</div>

<script>
const CFG = window.ALPHATICKER_CONFIG || window.LEDGER_CONFIG || {};
const HOSTED = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
const GA = window.TAnalytics || { track(){}, pageView(){} };
const PORT_KEY = "alphaticker-portfolio";
const WATCH_KEY = "alphaticker-watchlist";
const MERGED_KEY = "alphaticker-portfolio-merged";

const INDEXES = [
  { sym: "SPY",  name: "S&P 500",  colour: "#2a78d6" },
  { sym: "QQQ",  name: "NASDAQ",   colour: "#eda100" },
  { sym: "IWM",  name: "Russell",  colour: "#1baf7a" },
  { sym: "DIA",  name: "Dow",      colour: "#eb6834" },
];

const ETF_SET = new Set([
  "SPY","QQQ","IWM","DIA","VOO","VTI","IVV","VEA","VWO","EFA","EEM","AGG","BND",
  "LQD","HYG","TLT","IEF","SHY","GLD","SLV","USO","XLF","XLK","XLE","XLV","XLI",
  "XLY","XLP","XLU","XLB","XLRE","XLC","ARKK","ARKW","TQQQ","SQQQ","UVXY","VXX",
]);

const ASSET_COLORS = {
  Cash: "var(--s1)", Stocks: "var(--s2)", Funds: "var(--s3)",
  ETFs: "var(--s4)", Crypto: "var(--s6)",
};

async function rpc(fn, args){
  if (!HOSTED) throw new Error("config.js is missing, so there is no data source");
  const send = tok => fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: {
      apikey: CFG.supabaseAnonKey,
      "Content-Type": "application/json",
      ...(tok ? { Authorization: `Bearer ${tok}` } : {}),
    },
    body: JSON.stringify(args || {}),
  });
  let tok = window.TA && window.TA.token();
  let r = await send(tok);
  if (r.status === 401 && tok && window.TA && window.TA.recover) {
    r = await send(await window.TA.recover());
  }
  if (!r.ok) throw new Error(`${fn} failed (${r.status})`);
  return r.json();
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v == null || !Number.isFinite(v) ? "—"
  : `${v >= 0 ? "+" : ""}${v.toFixed(2)}%`;
/** Compact return for the holdings table (e.g. +8% / -8%). */
const retPct = v => {
  if (v == null || !Number.isFinite(v)) return "—";
  const n = Math.round(v);
  return `${n >= 0 ? "+" : ""}${n}%`;
};
const dir = v => v == null ? "" : v >= 0 ? "up" : "down";
const money = v => {
  if (v == null || !Number.isFinite(v)) return "—";
  const abs = Math.abs(v);
  const body = abs.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (v < 0 ? "-" : "") + "$" + body;
};
const moneySigned = v => {
  if (v == null || !Number.isFinite(v)) return "—";
  return (v >= 0 ? "+" : "") + money(v).replace("+", "");
};
const priceFmt = v => v == null || !Number.isFinite(v) ? "—"
  : v >= 1000 ? v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})
  : v.toFixed(2);
const signedIn = () => !!(window.TA && window.TA.signedIn && window.TA.signedIn());
const todayISO = () => {
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
};
const uid = () => `local-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;

const S = {
  transactions: [],
  positions: [],
  view: "portfolio",
  selected: "PORTFOLIO",
  indexes: Object.fromEntries(INDEXES.map(i => [i.sym, i.sym === "SPY" || i.sym === "QQQ"])),
  range: "YTD",
  priceCache: {},
  busy: false,
};

/* ---- local + remote portfolio ------------------------------------------- */
const localPort = {
  read(){
    try { return JSON.parse(localStorage.getItem(PORT_KEY) || "[]"); } catch { return []; }
  },
  write(list){
    try { localStorage.setItem(PORT_KEY, JSON.stringify(list)); } catch {}
  },
  clear(){ try { localStorage.removeItem(PORT_KEY); } catch {} },
};

function positionsFromTxns(txns){
  const map = {};
  for (const t of txns) {
    const sym = String(t.symbol || "").toUpperCase();
    if (!sym) continue;
    if (!map[sym]) map[sym] = {
      symbol: sym, quantity: 0, costIn: 0, proceeds: 0, dividends: 0,
      firstTrade: t.tradeDate, lastTrade: t.tradeDate,
      unrealizedPl: null, realizedPl: 0, _hasRealized: false,
    };
    const p = map[sym];
    const q = Number(t.quantity) || 0;
    const px = Number(t.price) || 0;
    const fee = Number(t.fee) || 0;
    if (t.kind === "buy") {
      p.quantity += q;
      p.costIn += q * px + fee;
    } else if (t.kind === "sell") {
      p.quantity -= q;
      p.proceeds += q * px - fee;
    } else if (t.kind === "dividend") {
      p.dividends += px || 0;
    }
    // Latest non-null unrealized snapshot; sum realized across entries.
    if (t.unrealizedPl != null && t.unrealizedPl !== "") {
      p.unrealizedPl = Number(t.unrealizedPl);
    }
    if (t.realizedPl != null && t.realizedPl !== "") {
      p.realizedPl = (p._hasRealized ? p.realizedPl : 0) + Number(t.realizedPl);
      p._hasRealized = true;
    }
    if (t.tradeDate < p.firstTrade) p.firstTrade = t.tradeDate;
    if (t.tradeDate > p.lastTrade) p.lastTrade = t.tradeDate;
  }
  return Object.values(map)
    .filter(p => Math.abs(p.quantity) > 1e-9)
    .map(p => {
      const { _hasRealized, ...rest } = p;
      return {
        ...rest,
        avgCost: p.quantity ? p.costIn / p.quantity : null,
        realizedPl: _hasRealized ? p.realizedPl : null,
      };
    });
}

function mapRemoteTxns(list){
  return (list || []).map(t => ({
    id: t.id,
    symbol: t.symbol,
    kind: t.kind,
    tradeDate: t.tradeDate,
    quantity: Number(t.quantity),
    price: Number(t.price),
    fee: Number(t.fee) || 0,
    note: t.note,
    unrealizedPl: t.unrealizedPl != null ? Number(t.unrealizedPl) : null,
    realizedPl: t.realizedPl != null ? Number(t.realizedPl) : null,
  }));
}

function mapRemotePositions(list){
  return (list || []).map(p => ({
    symbol: p.symbol,
    name: p.name,
    quantity: Number(p.quantity),
    costIn: Number(p.costIn),
    proceeds: Number(p.proceeds),
    dividends: Number(p.dividends),
    avgCost: p.avgCost != null ? Number(p.avgCost) : null,
    firstTrade: p.firstTrade,
    lastTrade: p.lastTrade,
    price: p.price != null ? Number(p.price) : null,
    changePct: p.changePct != null ? Number(p.changePct) : null,
    previousClose: p.previousClose != null ? Number(p.previousClose) : null,
    marketCap: p.marketCap,
    unrealizedPl: p.unrealizedPl != null ? Number(p.unrealizedPl) : null,
    realizedPl: p.realizedPl != null ? Number(p.realizedPl) : null,
  }));
}

function applyLocalPortfolio(){
  S.transactions = localPort.read();
  S.positions = positionsFromTxns(S.transactions);
}

function mirrorRemoteToLocal(remoteTx){
  localPort.write((remoteTx || []).map(t => ({
    id: t.id || uid(),
    symbol: t.symbol,
    kind: t.kind,
    tradeDate: t.tradeDate,
    quantity: t.quantity,
    price: t.price,
    fee: t.fee || 0,
    note: t.note || null,
    unrealizedPl: t.unrealizedPl,
    realizedPl: t.realizedPl,
  })));
  // Local now matches remote — do not upload these rows again on the next visit.
  try { sessionStorage.setItem(MERGED_KEY, "1"); } catch {}
}

async function loadPortfolio(){
  const local = localPort.read();

  if (signedIn()) {
    try {
      await mergeLocalIfNeeded();
      const d = await rpc("get_portfolio");
      if (d && !d.error) {
        const remoteTx = mapRemoteTxns(d.transactions);
        const remotePos = mapRemotePositions(d.positions);
        // Remote empty but local still has drafts — keep showing local and
        // retry merge next time rather than bouncing to the empty state.
        if (!remotePos.length && local.length) {
          applyLocalPortfolio();
          return;
        }
        S.transactions = remoteTx;
        S.positions = remotePos;
        // Mirror remote into local so a reload before auth is ready still works.
        if (remoteTx.length) mirrorRemoteToLocal(remoteTx);
        return;
      }
    } catch (e) {
      console.warn("[portfolio] remote load failed, using local", e);
    }
  }
  applyLocalPortfolio();
}

/** True for client-only drafts. Mirrored postgres ids must never be re-merged. */
function isLocalDraftId(id){
  if (id == null || id === "") return true;
  return typeof id === "string" && String(id).startsWith("local-");
}

async function mergeLocalIfNeeded(){
  if (!signedIn()) return;
  if (sessionStorage.getItem(MERGED_KEY)) return;
  const local = localPort.read();
  // Only upload unsynced drafts. Re-uploading mirrored rows (numeric ids)
  // duplicates every other ticker — e.g. after edit/delete cleared MERGED_KEY.
  const drafts = local.filter(t => isLocalDraftId(t.id));
  if (!drafts.length) {
    try { sessionStorage.setItem(MERGED_KEY, "1"); } catch {}
    return;
  }
  try {
    const d = await rpc("merge_portfolio", {
      p_transactions: drafts.map(t => ({
        symbol: t.symbol,
        kind: t.kind,
        tradeDate: t.tradeDate,
        quantity: t.quantity,
        price: t.price,
        fee: t.fee || 0,
        note: t.note || null,
      })),
    });
    if (d && !d.error) {
      try { sessionStorage.setItem(MERGED_KEY, "1"); } catch {}
    }
  } catch (e) {
    console.warn("[portfolio] merge failed", e);
  }
}

function writeLocalTxn(row, { allowMerge = true } = {}){
  if (row.kind === "sell") {
    const held = positionsFromTxns(localPort.read())
      .find(p => p.symbol === row.symbol);
    const q = held ? held.quantity : 0;
    if (row.quantity > q + 1e-9) throw new Error("sell exceeds holdings");
  }
  const list = localPort.read();
  list.push({ id: uid(), ...row });
  localPort.write(list);
  // Signed-out drafts must merge after sign-in. Signed-in saves also write
  // remotely — do not clear MERGED_KEY or mergeLocal would duplicate them.
  if (allowMerge) {
    try { sessionStorage.removeItem(MERGED_KEY); } catch {}
  }
}

async function addTransaction({ symbol, kind, tradeDate, quantity, price, fee }){
  const row = {
    symbol: String(symbol).toUpperCase().trim(),
    kind: kind || "buy",
    tradeDate,
    quantity: Number(quantity),
    price: Number(price),
    fee: Number(fee) || 0,
    unrealizedPl: null,
    realizedPl: null,
  };

  const isIn = signedIn();
  // Always persist locally first so a reload never drops the holding, even if
  // auth is not ready yet or the remote RPC is missing a migration.
  writeLocalTxn(row, { allowMerge: !isIn });

  if (isIn) {
    try {
      // P/L is computed client-side from live price − avg cost; do not store snapshots.
      const d = await rpc("add_portfolio_transaction", {
        p_symbol: row.symbol,
        p_kind: row.kind,
        p_trade_date: row.tradeDate,
        p_quantity: row.quantity,
        p_price: row.price,
        p_fee: row.fee,
      });
      if (d && d.error) throw new Error(d.error);
    } catch (e) {
      console.warn("[portfolio] remote save failed; kept local draft", e);
      // Remote failed — allow a later merge to upload this local-* draft only
      // (mergeLocalIfNeeded ignores already-mirrored numeric ids).
      try { sessionStorage.removeItem(MERGED_KEY); } catch {}
    }
  } else if (window.TA?.showSignupModal) {
    window.TA.showSignupModal({ reason: "portfolio" });
  }

  GA.track(row.kind === "sell" ? "portfolio_sell" : "portfolio_buy", {
    ticker: row.symbol,
  });
  await loadPortfolio();
}

/* ---- quotes / historical prices ----------------------------------------- */
async function enrichPrices(positions){
  const syms = [...new Set(positions.map(p => p.symbol).filter(Boolean))];
  if (!syms.length) return positions;

  let by = {};
  try {
    const rows = await rpc("get_symbol_quotes", { p_symbols: syms });
    const list = Array.isArray(rows) ? rows
      : (rows && Array.isArray(rows.items) ? rows.items : []);
    list.forEach(r => { if (r && r.symbol) by[r.symbol] = r; });
  } catch (e) {
    console.warn("[portfolio] get_symbol_quotes failed", e);
  }

  await Promise.all(syms.map(async sym => {
    try {
      if (!S.priceCache[sym] || !((S.priceCache[sym].bars || []).length)) {
        try { await rpc("request_prices", { p_symbol: sym }); } catch {}
        const d = await rpc("get_prices", { p_symbol: sym });
        if (d) S.priceCache[sym] = d;
      }
    } catch (e) {
      console.warn("[portfolio] get_prices failed", sym, e);
      if (!S.priceCache[sym]) S.priceCache[sym] = { bars: [] };
    }
    if (!by[sym] || by[sym].price == null) {
      const d = S.priceCache[sym] || {};
      const q = d.quote || {};
      const bars = d.bars || [];
      const px = q.price ?? q.close ?? (bars.length ? bars[bars.length - 1].c : null);
      if (px != null) {
        by[sym] = {
          symbol: sym,
          name: q.name,
          price: Number(px),
          changePct: q.change_pct ?? q.changePct ?? null,
          previousClose: q.previous_close ?? q.previousClose ?? null,
        };
      }
    }
  }));

  return positions.map(p => {
    const e = by[p.symbol];
    if (!e) return p;
    return {
      ...p,
      name: p.name || e.name || null,
      price: p.price != null ? p.price : (e.price != null ? Number(e.price) : null),
      changePct: p.changePct != null ? p.changePct
        : (e.changePct != null ? Number(e.changePct) : null),
      previousClose: p.previousClose != null ? p.previousClose
        : (e.previousClose != null ? Number(e.previousClose) : null),
    };
  });
}

function closeOnOrBefore(bars, iso){
  if (!bars || !bars.length || !iso) return null;
  let best = null;
  for (const b of bars) {
    const d = b.d || b.date;
    if (!d || d > iso) continue;
    if (!best || d > (best.d || best.date)) best = b;
  }
  return best ? Number(best.c) : null;
}

async function lookupBuyPrice(symbol, date){
  const sym = String(symbol || "").toUpperCase().trim();
  if (!sym || !date) return null;
  try { await rpc("request_prices", { p_symbol: sym }).catch(() => {}); } catch {}
  let d = S.priceCache[sym];
  if (!d || !(d.bars || []).length) {
    try { d = await rpc("get_prices", { p_symbol: sym }); S.priceCache[sym] = d; }
    catch { return null; }
  }
  return closeOnOrBefore((d && d.bars) || [], date);
}

/* ---- metrics ------------------------------------------------------------- */
function assetClass(symbol){
  if (ETF_SET.has(symbol)) return "ETFs";
  // Crypto tickers are rare in this universe; keep the bucket for the UI.
  if (/USD$|-USD$/.test(symbol) || ["BTC","ETH","SOL","DOGE"].includes(symbol)) return "Crypto";
  return "Stocks";
}

/** Live mark when we have a quote; otherwise cost basis so the page is never blank. */
function markPrice(p){
  if (p.price != null && Number.isFinite(p.price)) return p.price;
  if (p.avgCost != null && Number.isFinite(p.avgCost)) return p.avgCost;
  return null;
}

/** Today's dollar move for one holding. */
function todayPl(p){
  if (!p.quantity) return null;
  if (p.price != null && p.changePct != null && Number.isFinite(p.changePct)) {
    const v = p.price * p.quantity;
    return v * (p.changePct / (100 + p.changePct));
  }
  if (p.price != null && p.previousClose != null) {
    return (p.price - p.previousClose) * p.quantity;
  }
  return null;
}

/** Book P/L vs average buy: (today's price − avg buy) × quantity. */
function holdingPl(p){
  const px = p.price != null && Number.isFinite(p.price) ? p.price : markPrice(p);
  if (px == null || p.avgCost == null || !p.quantity) return null;
  return (px - p.avgCost) * p.quantity;
}

/** Return % vs average buy: (today's price / buy price − 1) × 100. */
function holdingRetPct(p){
  const px = p.price != null && Number.isFinite(p.price) ? p.price : markPrice(p);
  if (px == null || p.avgCost == null || !(p.avgCost > 0)) return null;
  return (px / p.avgCost - 1) * 100;
}

function allocation(positions){
  const totals = { Cash: 0, Stocks: 0, Funds: 0, ETFs: 0, Crypto: 0 };
  let sum = 0;
  for (const p of positions) {
    const px = markPrice(p);
    const v = (px || 0) * p.quantity;
    if (!(v > 0)) continue;
    const cls = assetClass(p.symbol);
    totals[cls] += v;
    sum += v;
  }
  const parts = Object.entries(totals).map(([name, value]) => ({
    name, value, pct: sum ? (value / sum) * 100 : 0, colour: ASSET_COLORS[name],
  }));
  return { sum, parts };
}

function dailyReturn(positions){
  let value = 0, dayPl = 0;
  for (const p of positions) {
    const px = markPrice(p);
    if (px == null || !p.quantity) continue;
    const v = px * p.quantity;
    value += v;
    // Day P/L only from a live quote — cost basis is not a daily move.
    if (p.price == null) continue;
    if (p.changePct != null) dayPl += v * (p.changePct / (100 + p.changePct));
    else if (p.previousClose != null) dayPl += (p.price - p.previousClose) * p.quantity;
  }
  const hasLive = positions.some(p => p.price != null && p.quantity);
  const pctDay = hasLive && value - dayPl !== 0 ? (dayPl / (value - dayPl)) * 100 : null;
  return { amount: hasLive ? dayPl : null, pct: pctDay, value };
}

/** Book return vs average buy cost for the current holdings (not calendar YTD). */
function bookReturn(positions){
  let cost = 0, current = 0;
  for (const p of positions) {
    const px = markPrice(p);
    if (px == null || !p.quantity || p.avgCost == null) continue;
    cost += p.avgCost * p.quantity;
    current += px * p.quantity;
  }
  const amount = current - cost;
  const pctRet = cost ? (amount / cost) * 100 : null;
  return { amount, pct: pctRet, cost, current };
}

/** Volatility score 0–100 (higher = more volatile / concentrated).
 *  65% weighted holding volatility (annualised 60d σ, capped at 50%),
 *  35% concentration (Herfindahl–Hirschman of weights). */
function volatilityScore(positions){
  const valued = positions.filter(p => markPrice(p) != null && p.quantity > 0);
  const total = valued.reduce((s, p) => s + markPrice(p) * p.quantity, 0);
  if (!total) return null;

  let wVol = 0;
  let hhi = 0;
  for (const p of valued) {
    const w = (markPrice(p) * p.quantity) / total;
    hhi += w * w;
    const bars = ((S.priceCache[p.symbol] && S.priceCache[p.symbol].bars) || []).slice(-61);
    const rets = [];
    for (let i = 1; i < bars.length; i++) {
      const a = Number(bars[i - 1].c), b = Number(bars[i].c);
      if (a > 0 && b > 0) rets.push((b - a) / a);
    }
    let sigma = 0.25; // default when history is thin
    if (rets.length >= 10) {
      const mean = rets.reduce((s, x) => s + x, 0) / rets.length;
      const var_ = rets.reduce((s, x) => s + (x - mean) ** 2, 0) / (rets.length - 1);
      sigma = Math.sqrt(var_) * Math.sqrt(252);
    }
    wVol += w * sigma;
  }
  const volComponent = Math.min(100, (wVol / 0.50) * 100);
  const score = Math.round(0.65 * volComponent + 0.35 * hhi * 100);
  const label = score < 33 ? "Calm" : score < 66 ? "Moderate" : "Elevated";
  return { score: Math.max(0, Math.min(100, score)), label, hhi, wVol };
}

/* ---- half-donut ---------------------------------------------------------- */
function halfDonutSvg(parts){
  const live = parts.filter(p => p.value > 0);
  const R = 50, CX = 60, CY = 60, SW = 12;
  if (!live.length) {
    return `<svg class="donut" viewBox="0 0 120 70" aria-hidden="true">
      <path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="var(--rule)"
        stroke-width="${SW}" stroke-linecap="butt"/></svg>`;
  }
  // Semicircle path length = πR. Dash along that arc left→right.
  const half = Math.PI * R;
  let offset = 0;
  const arcs = live.map(p => {
    const len = Math.max(0, (p.pct / 100) * half);
    const el = `<path d="M10 60 A50 50 0 0 1 110 60" fill="none"
      stroke="${p.colour}" stroke-width="${SW}"
      stroke-dasharray="${len} ${half}"
      stroke-dashoffset="${-offset}"
      stroke-linecap="butt"/>`;
    offset += len;
    return el;
  }).join("");
  return `<svg class="donut" viewBox="0 0 120 70" aria-hidden="true">${arcs}</svg>`;
}

async function loadWatchlistItems(){
  let items = [];
  if (signedIn()) {
    try {
      const d = await rpc("get_watchlist");
      items = ((d && d.items) || []).map(i => ({
        symbol: i.symbol, name: i.name, price: i.price, changePct: i.changePct,
      }));
    } catch {}
  }
  if (!items.length) {
    let local = [];
    try { local = JSON.parse(localStorage.getItem(WATCH_KEY) || "[]"); } catch {}
    items = local.map(symbol => ({ symbol, price: null, changePct: null }));
  }
  const missing = items.filter(i => i.price == null).map(i => i.symbol);
  if (missing.length) {
    try {
      const rows = await rpc("get_symbol_quotes", { p_symbols: missing }) || [];
      const by = {};
      rows.forEach(r => { if (r?.symbol) by[r.symbol] = r; });
      items = items.map(i => by[i.symbol] ? { ...i, ...by[i.symbol] } : i);
    } catch {}
  }
  return items;
}

async function toggleWatch(sym){
  if (signedIn()) {
    try { await rpc("toggle_watchlist", { p_symbol: sym }); return; } catch {}
  }
  let list = [];
  try { list = JSON.parse(localStorage.getItem(WATCH_KEY) || "[]"); } catch {}
  const set = new Set(list);
  if (set.has(sym)) set.delete(sym); else set.add(sym);
  try { localStorage.setItem(WATCH_KEY, JSON.stringify([...set])); } catch {}
}

/* ---- charts -------------------------------------------------------------- */
function rangeStartISO(range){
  const d = new Date();
  if (range === "1W") d.setDate(d.getDate() - 7);
  else if (range === "1M") d.setMonth(d.getMonth() - 1);
  else if (range === "1Y") d.setFullYear(d.getFullYear() - 1);
  else d.setMonth(0, 1); // YTD
  return d.toISOString().slice(0, 10);
}

async function seriesForSymbol(sym, fromISO){
  if (!S.priceCache[sym]) {
    try {
      await rpc("request_prices", { p_symbol: sym }).catch(() => {});
      S.priceCache[sym] = await rpc("get_prices", { p_symbol: sym }) || { bars: [] };
    } catch { S.priceCache[sym] = { bars: [] }; }
  }
  const bars = (S.priceCache[sym].bars || [])
    .filter(b => (b.d || b.date) >= fromISO)
    .map(b => ({ d: b.d || b.date, c: Number(b.c) }))
    .filter(b => b.d && Number.isFinite(b.c));
  return bars;
}

/** Portfolio NAV path for the chart: today's share counts × historical closes.
 *  This is a simulated “current mix” path — not the user’s personal return
 *  before they logged the portfolio. Book P/L in the table uses avg buy cost. */
async function portfolioSeries(fromISO){
  const positions = S.positions.filter(p => p.quantity > 0);
  if (!positions.length) return [];
  const series = await Promise.all(positions.map(async p => ({
    qty: p.quantity,
    bars: await seriesForSymbol(p.symbol, fromISO),
  })));
  const dates = new Set();
  series.forEach(s => s.bars.forEach(b => dates.add(b.d)));
  const sorted = [...dates].sort();
  return sorted.map(d => {
    let v = 0, ok = true;
    for (const s of series) {
      const bar = [...s.bars].reverse().find(b => b.d <= d);
      if (!bar) { ok = false; break; }
      v += bar.c * s.qty;
    }
    return ok ? { d, c: v } : null;
  }).filter(Boolean);
}

function toPctSeries(bars){
  if (!bars.length) return [];
  const base = bars[0].c;
  if (!base) return [];
  return bars.map(b => ({ d: b.d, c: ((b.c / base) - 1) * 100 }));
}

         · ${esc(String(Number(pos.quantity.toFixed(4))))} shares

    // Prefer intraday when available; fall back to daily.

      if (intra && intra.points && intra.points.length > 2) {

      }

    const bars = await seriesForSymbol(S.selected, from);
    drawLineChart(host, [{ id: S.selected, colour: "var(--accent)", points: bars }], { unit: "price" });
    return;
  }

  // Portfolio vs indexes (percentage)

    `Book <span class="${dir(book.pct)}">${esc(pct(book.pct))}</span>` +
    ` · chart = current mix (simulated) vs indexes`;

  const portBars = toPctSeries(await portfolioSeries(from));
  const lines = [{ id: "Portfolio", colour: "#38b37d", points: portBars }];
  for (const ix of INDEXES) {
    if (!S.indexes[ix.sym]) continue;
    const bars = toPctSeries(await seriesForSymbol(ix.sym, from));
    lines.push({ id: ix.sym, colour: ix.colour, points: bars });
  }
  drawLineChart(host, lines, { unit: "pct" });
}

function drawLineChart(host, lines, { unit }){
  const W = 900, H = 380, pad = { l: 54, r: 16, t: 16, b: 36 };
  const all = lines.flatMap(l => l.points);
  if (!all.length) {
    host.innerHTML = `<div class="note">No price history yet — it will appear once daily bars are available.</div>`;
    return;
  }
  const xs = all.map(p => p.d);
  const ys = all.map(p => p.c);
  const x0 = xs[0], x1 = xs[xs.length - 1];
  // Use chronological index per series; align by date string order.
  const dates = [...new Set(xs)].sort();
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const span = maxY - minY || 1;
  const yMin = minY - span * 0.08, yMax = maxY + span * 0.08;

  const xAt = d => {
    const i = dates.indexOf(d);
    return pad.l + (i / Math.max(1, dates.length - 1)) * (W - pad.l - pad.r);
  };
  const yAt = v => pad.t + (1 - (v - yMin) / (yMax - yMin || 1)) * (H - pad.t - pad.b);

  const grid = [];
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (i / 4) * (yMax - yMin);
    const y = yAt(v);
    const label = unit === "pct"
      ? `${v >= 0 ? "+" : ""}${v.toFixed(2)}%`
      : priceFmt(v);
    grid.push(`<line x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}"
      stroke="var(--rule-2)" stroke-width="1"/>
      <text x="${pad.l - 8}" y="${y + 4}" text-anchor="end" fill="var(--ink-3)"
        font-size="11" font-family="IBM Plex Mono,monospace">${esc(label)}</text>`);
  }

  const paths = lines.map(l => {
    if (l.points.length < 2) return "";
    const d = l.points.map((p, i) =>
      `${i ? "L" : "M"}${xAt(p.d).toFixed(1)},${yAt(p.c).toFixed(1)}`).join(" ");
    return `<path d="${d}" fill="none" stroke="${l.colour}" stroke-width="2"/>`;
  }).join("");

  const xLabels = [dates[0], dates[Math.floor(dates.length / 2)], dates[dates.length - 1]]
    .filter(Boolean)
    .map(d => `<text x="${xAt(d)}" y="${H - 10}" text-anchor="middle" fill="var(--ink-3)"
      font-size="11">${esc(d)}</text>`).join("");

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%"
    preserveAspectRatio="none" role="img" aria-label="Performance chart">
    ${grid.join("")}${paths}${xLabels}
    ${unit === "pct" ? `<line x1="${pad.l}" y1="${yAt(0)}" x2="${W - pad.r}" y2="${yAt(0)}"
      stroke="var(--ink-3)" stroke-dasharray="4 4" stroke-width="1" opacity=".5"/>` : ""}
  </svg>`;
}

/* ---- add / sell / edit modal -------------------------------------------- */
let addKind = "buy"; // buy | sell | edit
let editSymbol = null;

function setModalMode(kind, symbol, prefill){
  addKind = kind;
  editSymbol = kind === "edit" ? symbol : null;

  const title = document.getElementById("add-title");

  if (kind === "edit") {
    title.textContent = "Edit holding";
    sub.textContent = "Update this ticker’s quantity and average buy price. P/L updates from the live quote. Delete removes it from your portfolio.";
    save.textContent = "Save changes";
    del.hidden = false;
    symEl.readOnly = true;
  } else if (kind === "sell") {
    title.textContent = "Sell shares";
    sub.textContent = "Record a sale. Quantity cannot exceed what you currently hold.";
    save.textContent = "Record sale";
    del.hidden = true;
    symEl.readOnly = false;
  } else {
    title.textContent = "Add to portfolio";
    sub.textContent = "Enter your current holding as of today — ticker, quantity, and average buy price. P/L is calculated from live price.";
    save.textContent = "Add holding";
    del.hidden = true;
    symEl.readOnly = false;
  }

  document.querySelector('label[for="f-price"]').textContent =
    kind === "sell" ? "Sale price per share" : "Average buy price per share";
  priceHint.textContent = kind === "sell"
    ? "Price you sold at."
    : "Your cost basis per share from your brokerage.";

  symEl.value = (prefill && prefill.symbol) || symbol || "";
  document.getElementById("f-date").value = (prefill && prefill.tradeDate) || todayISO();
  document.getElementById("f-date").max = todayISO();
  document.getElementById("f-qty").value =
    prefill && prefill.quantity != null ? String(prefill.quantity) : "";
  document.getElementById("f-price").value =
    prefill && prefill.price != null ? String(prefill.price) : "";
  document.getElementById("add-err").textContent = "";
  modal.hidden = false;
  if (kind === "edit" || symbol) document.getElementById("f-qty").focus();
  else symEl.focus();
}

function openAddModal(symbol, kind){
  setModalMode(kind === "sell" ? "sell" : "buy", symbol, null);
}

function openEditModal(symbol){
  const pos = S.positions.find(p => p.symbol === symbol);
  if (!pos) return;
  setModalMode("edit", symbol, {
    symbol: pos.symbol,
    tradeDate: todayISO(),
    quantity: Number(pos.quantity.toFixed(4)),
    price: pos.avgCost != null ? Number(Number(pos.avgCost).toFixed(4)) : null,
  });
}

function closeAddModal(){
  document.getElementById("add-modal").hidden = true;
  editSymbol = null;
}

/** Remove every transaction for a ticker (local + remote). */
async function deleteSymbolHoldings(symbol){
  const sym = String(symbol || "").toUpperCase();
  const txns = (S.transactions || []).filter(t => t.symbol === sym);
  localPort.write(localPort.read().filter(t => t.symbol !== sym));
  // Signed-in deletes go through the API. Remaining local rows are mirrors of
  // remote — clearing MERGED_KEY would re-upload them and double quantities.
  if (!signedIn()) {
    try { sessionStorage.removeItem(MERGED_KEY); } catch {}
  }

  if (signedIn()) {
    for (const t of txns) {
      const id = Number(t.id);
      if (!Number.isFinite(id)) continue;
      try {
        const d = await rpc("delete_portfolio_transaction", { p_id: id });
        if (d && d.error) console.warn("[portfolio] delete failed", d.error);
      } catch (e) {
        console.warn("[portfolio] delete failed", e);
      }
    }
  }
  GA.track("portfolio_delete", { ticker: sym });
  await loadPortfolio();
}

/** Replace a ticker’s holdings with a single updated buy snapshot. */
async function replaceHolding(fields){
  await deleteSymbolHoldings(fields.symbol);
  // deleteSymbolHoldings already reloaded; addTransaction appends the new row.
  await addTransaction({
    symbol: fields.symbol,
    kind: "buy",
    tradeDate: fields.tradeDate,
    quantity: fields.quantity,
    price: fields.price,
  });
}

function wireModal(){
  const modal = document.getElementById("add-modal");
  document.getElementById("add-x").onclick = closeAddModal;
  document.getElementById("add-cancel").onclick = closeAddModal;
  modal.addEventListener("click", e => { if (e.target === modal) closeAddModal(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !modal.hidden) closeAddModal();
  });

  document.getElementById("add-delete").onclick = async () => {
    const symbol = editSymbol || document.getElementById("f-symbol").value.trim().toUpperCase();
    if (!symbol) return;
    if (!confirm(`Remove ${symbol} from your portfolio? This deletes its transactions.`)) return;
    const btn = document.getElementById("add-delete");
    btn.disabled = true;
    try {
      await deleteSymbolHoldings(symbol);
      closeAddModal();
      toast(`Removed ${symbol}`);
      await boot(false);
    } catch (ex) {
      document.getElementById("add-err").textContent = ex.message || "Could not delete.";
    } finally {
      btn.disabled = false;
    }
  };

  document.getElementById("add-form").onsubmit = async e => {
    e.preventDefault();
    const err = document.getElementById("add-err");
    err.textContent = "";
    const symbol = document.getElementById("f-symbol").value.trim().toUpperCase();
    const tradeDate = document.getElementById("f-date").value || todayISO();
    const quantity = Number(document.getElementById("f-qty").value);
    const price = Number(document.getElementById("f-price").value);
    if (!/^[A-Z][A-Z.\-]{0,9}$/.test(symbol)) {
      err.textContent = "Enter a valid ticker.";
      return;
    }
    if (!(quantity > 0) || !(price >= 0)) {
      err.textContent = addKind === "sell"
        ? "Quantity and sale price are required."
        : "Quantity and average buy price are required.";
      return;
    }
    const save = document.getElementById("add-save");
    save.disabled = true;
    try {
      if (addKind === "edit") {
        await replaceHolding({ symbol, tradeDate, quantity, price });
        closeAddModal();
        toast(`Updated ${symbol}`);
      } else {
        await addTransaction({ symbol, kind: addKind, tradeDate, quantity, price });
        closeAddModal();
        toast(addKind === "sell" ? `Sold ${quantity} ${symbol}` : `Added ${quantity} ${symbol}`);
      }
      await boot(false);
    } catch (ex) {
      err.textContent = ex.message || "Could not save.";
    } finally {
      save.disabled = false;
    }
  };
}

function wireTickerSearch(inputId, acId, formId, onPick){
  const q = document.getElementById(inputId);
  const ac = document.getElementById(acId);
  const form = document.getElementById(formId);
  if (!q || !ac) return;
  let timer = null;
  const close = () => { ac.innerHTML = ""; ac.classList.remove("open"); };
  q.addEventListener("input", () => {
    clearTimeout(timer);
    const term = q.value.trim();
    if (!term) return close();
    timer = setTimeout(async () => {
      let items = [];
      try { items = await rpc("search_companies", { q: term }) || []; } catch {}
      if (!items.length) return close();
      ac.innerHTML = items.slice(0, 6).map(x =>
        `<div data-s="${esc(x.ticker)}"><b>${esc(x.ticker)}</b><span>${esc(x.name)}</span></div>`).join("");
      ac.classList.add("open");
      ac.querySelectorAll("[data-s]").forEach(d => {
        d.onmousedown = e => {
          e.preventDefault();
          GA.track("search", { search_term: term, source: "portfolio" });
          close();
          q.value = "";
          onPick(d.dataset.s);
        };
      });
    }, 140);
  });
  q.addEventListener("blur", () => setTimeout(close, 150));
  if (form) form.onsubmit = e => {
    e.preventDefault();
    const sym = q.value.trim().toUpperCase();
    if (!sym) return;
    GA.track("search", { search_term: sym, source: "portfolio" });
    close();
    q.value = "";
    onPick(sym);
  };
}

function toast(msg){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ---- boot ---------------------------------------------------------------- */
async function boot(showLoading = true){
  if (showLoading) {
    document.getElementById("app").innerHTML =
      `<div class="note"><span class="load"></span></div>`;
  }
  await loadPortfolio();
  if (S.positions.length) {
    S.positions = await enrichPrices(S.positions);
    // Prefetch history used by vol score / chart.
    await Promise.all(S.positions.map(p => seriesForSymbol(p.symbol, rangeStartISO("1Y"))));
    renderDashboard();
    // Quotes sometimes arrive a beat late after request_prices — refresh once.
    if (S.positions.some(p => p.price == null)) {
      setTimeout(async () => {
        S.priceCache = {};
        S.positions = await enrichPrices(S.positions);
        if (S.positions.some(p => p.price != null)) renderDashboard();
      }, 1500);
    }
  } else {
    renderEmpty();
  }
}

wireModal();
</script>
<!-- nav.js must load before boot so window.TA / session exist. Previously boot
     ran first, skipped onAuthChange registration, and signed-in holdings never
     reloaded — the empty state came back on every visit. -->
<script src="nav.js"></script>
<script>
(async function start(){
  if (window.TA && window.TA.onAuthChange) {
    window.TA.onAuthChange(() => boot(false));
  } else {
    addEventListener("ta-auth", () => boot(false));
  }
  await boot(true);
})();
</script>

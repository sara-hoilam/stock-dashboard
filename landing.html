<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Ticker — markets today</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   Markets Today — the same design system as the company page, so moving
   between them does not feel like changing product. Identical tokens,
   typography and card treatment; only the content differs.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --ground:#eef0f3; --card:#ffffff; --sunk:#f6f7f9;
  --ink:#111820; --ink-2:#4a5866; --ink-3:#78889a;
  --rule:#dde2e8; --rule-2:#eaeef2;
  --accent:#1e4fbf; --accent-soft:#e6ecfb;
  --up:#0b7a4b; --down:#c0392e;
  --up-soft:#e3f4ec; --down-soft:#fbe9e7;
  --revenue:#2a78d6;
  --shadow:0 1px 2px rgba(17,24,32,.06), 0 6px 20px -12px rgba(17,24,32,.22);
  --r:10px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:#0d1219; --card:#151c25; --sunk:#111821;
  --ink:#e7edf4; --ink-2:#a3b1c0; --ink-3:#77879a;
  --rule:#232d3a; --rule-2:#1c2531;
  --accent:#6e9bff; --accent-soft:#1a2740;
  --up:#38b37d; --down:#f0736a;
  --up-soft:#12291f; --down-soft:#2b1614;
  --revenue:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  background:var(--ground); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
main{max-width:1360px;margin:0 auto;padding:26px 24px 72px}

/* ---- masthead ------------------------------------------------------------ */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-family:"IBM Plex Serif",Georgia,serif;font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.top .sub{color:var(--ink-3);font-size:12.5px;margin-top:6px}
.top .sub b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink-2)}
.topright{display:flex;gap:10px;align-items:center}
.ghost{
  background:transparent;border:1px solid var(--rule);border-radius:7px;
  padding:8px 13px;cursor:pointer;color:var(--ink-2);font:inherit;font-size:12.5px;
}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---- headline cards ------------------------------------------------------ */
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:26px}
.card{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:15px 16px;box-shadow:var(--shadow);min-height:104px;
  display:flex;flex-direction:column;
}
.card .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.card .v{font-family:"IBM Plex Serif",Georgia,serif;font-size:23px;font-weight:600;
  letter-spacing:-.015em;margin-top:8px;line-height:1.15;overflow-wrap:break-word;
  hyphens:none}
.card .d{font-size:12px;margin-top:auto;padding-top:6px;color:var(--ink-3)}
.card .d b{font-family:"IBM Plex Mono",monospace;font-weight:600}
.up{color:var(--up)} .down{color:var(--down)}

/* ---- market summary ------------------------------------------------------ */
h2{font-size:15px;font-weight:600;letter-spacing:-.005em;margin-bottom:12px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.split{display:grid;grid-template-columns:minmax(320px,420px) 1fr;min-height:520px}

.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:14px 18px 10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;flex-shrink:0}
.seg button{background:transparent;border:0;padding:6px 11px;font:inherit;font-size:12px;
  cursor:pointer;color:var(--ink-2);border-right:1px solid var(--rule);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:500}

/* Eight rows, then scroll -- enough to see the shape of the list without the
   panel growing taller than the chart beside it. */
.rows{border-right:1px solid var(--rule);overflow-y:auto;max-height:365px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{
  position:sticky;top:0;background:var(--card);z-index:1;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;text-align:right;padding:8px 18px 8px 0;border-bottom:1px solid var(--rule);
}
thead th:first-child{text-align:left;padding-left:18px}
tbody td{padding:9px 0 9px 0;border-bottom:1px solid var(--rule-2);text-align:right;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
tbody td:first-child{text-align:left;padding-left:18px;font-family:"IBM Plex Sans",sans-serif}
tbody td:last-child{padding-right:18px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
tbody tr[aria-selected=true] td{background:var(--accent-soft)}
.sym{display:flex;align-items:center;gap:9px}
.dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;color:#fff;letter-spacing:-.02em}
.tick{font-weight:500}
.pill{display:inline-block;min-width:64px;text-align:right;padding:2px 7px;border-radius:5px;
  font-size:12.5px;font-weight:500}
.pill.up{background:var(--up-soft)} .pill.down{background:var(--down-soft)}

/* ---- chart --------------------------------------------------------------- */
.chartwrap{padding:14px 18px 18px;display:flex;flex-direction:column;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.chead .price{display:flex;align-items:baseline;gap:12px}
.chead .price b{font-family:"IBM Plex Serif",Georgia,serif;font-size:27px;font-weight:600;letter-spacing:-.015em}
.chead .price span{font-family:"IBM Plex Mono",monospace;font-size:22px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chead .meta{font-size:12px;color:var(--ink-3);margin-top:3px}
.search{position:relative}
.search input{
  background:var(--sunk);border:1px solid var(--rule);border-radius:8px;
  padding:9px 13px;font:inherit;font-size:13px;color:var(--ink);width:230px;
  font-family:"IBM Plex Mono",monospace;
}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;background:var(--card)}
.ac{position:absolute;top:calc(100% + 5px);right:0;z-index:60;width:320px;background:var(--card);
  border:1px solid var(--rule);border-radius:9px;box-shadow:var(--shadow);overflow:hidden;display:none}
.ac.open{display:block}
.ac div{padding:8px 11px;cursor:pointer;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--rule-2)}
.ac div:last-child{border-bottom:0}
.ac div:hover,.ac div[aria-selected=true]{background:var(--accent-soft)}
.ac b{font-family:"IBM Plex Mono",monospace;font-size:12.5px;min-width:56px;color:var(--accent)}
.ac span{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chart{flex:1;min-height:360px}
svg{display:block;max-width:100%}
.tnum{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

.note{padding:30px 18px;color:var(--ink-3);font-size:13px;text-align:center}
.foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:12px;color:var(--ink-3);line-height:1.7}
.foot a{color:var(--accent);text-decoration:none}
.foot a:hover{text-decoration:underline}
.load{display:inline-block;width:13px;height:13px;border:2px solid var(--rule);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:1180px){ .cards{grid-template-columns:repeat(3,minmax(0,1fr))} .split{grid-template-columns:1fr} .rows{border-right:0;border-bottom:1px solid var(--rule)} }
@media (max-width:640px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} .top h1{font-size:26px} main{padding:18px 14px 60px} .search input{width:160px} }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Markets Today</h1>
      <div class="sub" id="asof">Loading…</div>
    </div>
    <div class="topright">
      <a class="ghost" href="company.html" style="text-decoration:none">Company financials →</a>
      <button class="ghost" id="theme" aria-label="Switch colour theme">Dark</button>
    </div>
  </div>

  <section class="cards" id="cards"></section>

  <h2>Market Summary</h2>
  <section class="panel">
    <div class="split">
      <div>
        <div class="listhead">
          <div class="seg" id="views">
            <button data-v="market_cap" aria-pressed="true">Market cap</button>
            <button data-v="gainers" aria-pressed="false">Top gainers</button>
            <button data-v="losers" aria-pressed="false">Top losers</button>
          </div>
        </div>
        <div class="rows" id="rows"><div class="note"><span class="load"></span></div></div>
      </div>

      <div class="chartwrap">
        <div class="chead">
          <div>
            <div class="price"><b id="c-sym">—</b><span id="c-price"></span></div>
            <div class="meta" id="c-meta"></div>
          </div>
          <div class="search">
            <input type="text" id="q" placeholder="Ticker & Press Enter…" autocomplete="off"
                   role="combobox" aria-expanded="false" aria-controls="ac">
            <div class="ac" id="ac" role="listbox"></div>
          </div>
        </div>
        <div id="chart"></div>
      </div>
    </div>
  </section>

  <div class="foot" id="foot"></div>
</main>

<script>
"use strict";

const CFG = window.ALPHATICKER_CONFIG || window.LEDGER_CONFIG || {};
const HOSTED = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);

async function rpc(fn, args){
  if (!HOSTED) throw new Error("config.js is missing, so there is no data source");
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: CFG.supabaseAnonKey, "Content-Type": "application/json" },
    body: JSON.stringify(args || {}),
  });
  if (!r.ok) throw new Error(`${fn} failed (${r.status})`);
  return r.json();
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v === null || v === undefined ? "—" : `${v >= 0 ? "+" : ""}${v.toFixed(2)}%`;
const dir = v => v >= 0 ? "up" : "down";
const price = v => v === null || v === undefined ? "—"
  : v >= 1000 ? v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})
  : v.toFixed(2);
const cap = v => {
  if (!v) return "—";
  if (v >= 1e12) return `$${(v/1e12).toFixed(2)}T`;
  if (v >= 1e9)  return `$${(v/1e9).toFixed(1)}B`;
  return `$${(v/1e6).toFixed(0)}M`;
};
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const longDate = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number);
  return `${MONTHS[m-1]} ${d}, ${y}`; };

// A stable colour per symbol, so a ticker keeps its identity between views.
const AVATAR = ["--accent","#eb6834","#1baf7a","#eda100","#e87ba4","#4a3aa7","#2a78d6","#e34948"];
const avatarColour = s => {
  let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const c = AVATAR[h % AVATAR.length];
  return c.startsWith("--") ? `var(${c})` : c;
};

const S = { view: "market_cap", rows: [], symbol: null, overview: null };

/* ---- headline cards ------------------------------------------------------ */
function renderCards(o){
  const sectors = o.sectors || [];
  const best = sectors[0], worst = sectors[sectors.length - 1];
  const b = o.breadth;
  // "Bullish" is a claim, so the card shows what it rests on rather than
  // asserting a mood on its own.
  const bullish = b && b.total ? b.up / b.total >= 0.5 : null;

  const cards = [
    ["Market",
     bullish === null ? "—" : (bullish ? "Bullish" : "Bearish"),
     b ? `<b class="${dir(b.avgChange)}">${b.up}/${b.total}</b> advancing` : ""],
    ["Leader", o.leader ? o.leader.symbol : "—",
     o.leader ? `<b class="${dir(o.leader.changePct)}">${pct(o.leader.changePct)}</b>` : ""],
    ["Hottest sector", best ? best.sector : "—",
     best ? `<b class="${dir(best.changePct)}">${pct(best.changePct)}</b>` : ""],
    ["Worst sector", worst ? worst.sector : "—",
     worst ? `<b class="${dir(worst.changePct)}">${pct(worst.changePct)}</b>` : ""],
    ["Top stock", o.topStock ? o.topStock.symbol : "—",
     o.topStock ? `<b class="${dir(o.topStock.changePct)}">${pct(o.topStock.changePct)}</b>` : ""],
    ["Worst stock", o.worstStock ? o.worstStock.symbol : "—",
     o.worstStock ? `<b class="${dir(o.worstStock.changePct)}">${pct(o.worstStock.changePct)}</b>` : ""],
  ];

  document.getElementById("cards").innerHTML = cards.map(([k,v,d]) => `
    <div class="card">
      <div class="k">${esc(k)}</div>
      <div class="v">${esc(v)}</div>
      <div class="d">${d}</div>
    </div>`).join("");

  document.getElementById("asof").innerHTML = o.asOf
    ? `Last trading day <b>${longDate(o.asOf)}</b> · every figure is the close, not a live quote`
    : "No market data yet";
}

/* ---- the list ------------------------------------------------------------ */
function renderRows(){
  const host = document.getElementById("rows");
  if (!S.rows.length){ host.innerHTML = `<div class="note">Nothing to show for this view yet.</div>`; return; }
  const showCap = S.view === "market_cap";

  host.innerHTML = `<table><thead><tr>
      <th>Symbol</th><th>Price</th>${showCap ? "<th>Mkt cap</th>" : ""}<th>% Change</th>
    </tr></thead><tbody>${S.rows.map(r => `
      <tr data-s="${esc(r.symbol)}" aria-selected="${r.symbol === S.symbol}"
          title="Open ${esc(r.symbol)} financials">
        <td><span class="sym">
          <span class="dot" style="background:${avatarColour(r.symbol)}">${esc(r.symbol.slice(0,2))}</span>
          <span class="tick">${esc(r.symbol)}</span></span></td>
        <td>${esc(price(r.price))}</td>
        ${showCap ? `<td>${esc(cap(r.marketCap))}</td>` : ""}
        <td><span class="pill ${dir(r.changePct)}">${esc(pct(r.changePct))}</span></td>
      </tr>`).join("")}</tbody></table>`;

  // A row click loads the chart; the symbol itself opens the financials, which
  // is the whole point of the landing page.
  host.querySelectorAll("tr[data-s]").forEach(tr => {
    tr.onclick = () => selectSymbol(tr.dataset.s);
    tr.querySelector(".tick").onclick = e => { e.stopPropagation(); openCompany(tr.dataset.s); };
  });
}

const openCompany = sym => { location.href = `company.html?t=${encodeURIComponent(sym)}`; };

async function setView(v){
  S.view = v;
  document.querySelectorAll("#views button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.v === v));
  document.getElementById("rows").innerHTML = `<div class="note"><span class="load"></span></div>`;
  S.rows = await rpc("get_market_summary", { p_view: v, p_limit: 20 }) || [];
  if (!S.rows.some(r => r.symbol === S.symbol) && S.rows.length) selectSymbol(S.rows[0].symbol);
  else renderRows();
}

/* ---- chart --------------------------------------------------------------- */
async function selectSymbol(sym){
  S.symbol = sym;
  renderRows();
  document.getElementById("c-sym").textContent = sym;
  document.getElementById("c-price").textContent = "";
  document.getElementById("c-meta").textContent = "";
  document.getElementById("chart").innerHTML = `<div class="note"><span class="load"></span></div>`;

  let d = null;
  try { d = await rpc("get_intraday", { p_symbol: sym }); } catch {}
  const row = S.rows.find(r => r.symbol === sym);
  const q = (d && d.quote) || row || null;

  if (q) {
    document.getElementById("c-price").textContent = price(q.price);
    const cp = q.changePct ?? q.change_pct;
    document.getElementById("c-meta").innerHTML =
      `${esc(q.name || "")} ${cp !== undefined && cp !== null
        ? `· <b class="${dir(cp)}">${pct(cp)}</b>` : ""}
       · <a href="company.html?t=${encodeURIComponent(sym)}"
            style="color:var(--accent);text-decoration:none">view financials →</a>`;
  }

  if (!d || !d.points || !d.points.length) {
    document.getElementById("chart").innerHTML =
      `<div class="note">No intraday series stored for ${esc(sym)} yet.<br>
       <a href="company.html?t=${encodeURIComponent(sym)}"
          style="color:var(--accent)">Open its filed financials instead →</a></div>`;
    return;
  }
  drawChart(d.points);
}

function drawChart(points){
  const W = 900, H = 380, ml = 8, mr = 62, mt = 16, mb = 34;
  const pw = W - ml - mr, ph = H - mt - mb;
  const vals = points.map(p => p.c);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.08 || 1;
  const y = v => mt + ph - ((v - (lo - pad)) / ((hi + pad) - (lo - pad))) * ph;
  const x = i => ml + (pw * i) / Math.max(1, points.length - 1);

  const parts = [];
  // Horizontal guides, labelled on the right the way a price axis reads.
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = (lo - pad) + ((hi + pad) - (lo - pad)) * i / ticks;
    parts.push(`<line x1="${ml}" y1="${y(v)}" x2="${W-mr}" y2="${y(v)}" stroke="var(--rule-2)"></line>
      <text x="${W-mr+8}" y="${y(v)+4}" font-size="10.5" class="tnum" fill="var(--ink-3)">${v.toFixed(2)}</text>`);
  }

  // Session boundaries, so a two-day series reads as two days.
  let prevDay = points[0].t.slice(0,10);
  points.forEach((p,i) => {
    const day = p.t.slice(0,10);
    if (day !== prevDay) {
      parts.push(`<line x1="${x(i)}" y1="${mt}" x2="${x(i)}" y2="${mt+ph}" stroke="var(--rule)"></line>
        <text x="${x(i)+5}" y="${H-mb+16}" font-size="10.5" fill="var(--ink-2)" font-weight="600">${day.slice(8,10)}</text>`);
      prevDay = day;
    }
  });

  const first = vals[0], last = vals[vals.length-1];
  const stroke = last >= first ? "var(--up)" : "var(--down)";
  const d = points.map((p,i) => `${i?"L":"M"}${x(i)},${y(p.c)}`).join(" ");
  parts.push(`<path d="${d} L${x(points.length-1)},${mt+ph} L${x(0)},${mt+ph} Z"
    fill="${stroke}" opacity=".08"></path>`);
  parts.push(`<path d="${d}" fill="none" stroke="${stroke}" stroke-width="1.8"
    stroke-linejoin="round" stroke-linecap="round"></path>`);

  // Last value, called out on the axis.
  parts.push(`<line x1="${ml}" y1="${y(last)}" x2="${W-mr}" y2="${y(last)}"
      stroke="${stroke}" stroke-width="1" stroke-dasharray="3 3" opacity=".55"></line>
    <rect x="${W-mr+2}" y="${y(last)-9}" width="56" height="18" rx="4" fill="${stroke}"></rect>
    <text x="${W-mr+30}" y="${y(last)+4}" text-anchor="middle" font-size="11"
      class="tnum" fill="#fff" font-weight="600">${last.toFixed(2)}</text>`);

  // Time labels at the ends and middle -- enough to orient without clutter.
  [0, Math.floor(points.length/2), points.length-1].forEach(i => {
    parts.push(`<text x="${Math.min(Math.max(x(i),ml+16), W-mr-16)}" y="${H-mb+16}"
      text-anchor="middle" font-size="10.5" class="tnum" fill="var(--ink-3)">${points[i].t.slice(11,16)}</text>`);
  });

  // Crosshair, hidden until the pointer is actually over the plot.
  parts.push(`<g id="cross" style="display:none;pointer-events:none">
      <line id="cx" y1="${mt}" y2="${mt+ph}" stroke="var(--ink-3)"
            stroke-width="1" stroke-dasharray="4 4"></line>
      <line id="cy" x1="${ml}" x2="${W-mr}" stroke="var(--ink-3)"
            stroke-width="1" stroke-dasharray="4 4"></line>
      <circle id="cdot" r="4" fill="var(--ink-2)" stroke="var(--card)" stroke-width="2"></circle>
      <g id="cplab"><rect x="${W-mr+2}" width="56" height="18" rx="4" fill="var(--ink)"></rect>
        <text x="${W-mr+30}" text-anchor="middle" font-size="11" class="tnum"
              fill="var(--card)" font-weight="600"></text></g>
      <g id="ctlab"><rect height="18" rx="4" fill="var(--ink)"></rect>
        <text text-anchor="middle" font-size="10.5" class="tnum"
              fill="var(--card)" font-weight="600"></text></g>
    </g>`);
  // A transparent surface above everything, so the pointer is tracked even
  // between data points rather than only over the line itself.
  parts.push(`<rect id="hit" x="${ml}" y="${mt}" width="${pw}" height="${ph}"
      fill="transparent" style="cursor:crosshair"></rect>`);

  document.getElementById("chart").innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
       aria-label="Intraday price">${parts.join("")}</svg>`;

  wireCrosshair({points, x, y, W, H, ml, mr, mt, mb, ph});
}

/** Follow the pointer along the series, snapping to the nearest bar. */
function wireCrosshair(g){
  const svg = document.querySelector("#chart svg");
  const hit = svg.querySelector("#hit"), cross = svg.querySelector("#cross");
  const cx = svg.querySelector("#cx"), cy = svg.querySelector("#cy");
  const dot = svg.querySelector("#cdot");
  const pRect = svg.querySelector("#cplab rect"), pText = svg.querySelector("#cplab text");
  const tRect = svg.querySelector("#ctlab rect"), tText = svg.querySelector("#ctlab text");

  const toLocal = ev => {
    const b = svg.getBoundingClientRect();
    return (ev.clientX - b.left) * (g.W / b.width);
  };

  hit.addEventListener("mousemove", ev => {
    const px = toLocal(ev);
    const step = (g.W - g.ml - g.mr) / Math.max(1, g.points.length - 1);
    const i = Math.max(0, Math.min(g.points.length - 1, Math.round((px - g.ml) / step)));
    const p = g.points[i], X = g.x(i), Y = g.y(p.c);

    cross.style.display = "";
    cx.setAttribute("x1", X); cx.setAttribute("x2", X);
    cy.setAttribute("y1", Y); cy.setAttribute("y2", Y);
    dot.setAttribute("cx", X); dot.setAttribute("cy", Y);

    pRect.setAttribute("y", Y - 9);
    pText.setAttribute("y", Y + 4);
    pText.textContent = p.c.toFixed(2);

    // Date and time, clamped so the label never runs off either end.
    const label = `${p.t.slice(8,10)} ${MONTHS[+p.t.slice(5,7)-1]} '${p.t.slice(2,4)}  ${p.t.slice(11,16)}`;
    const w = Math.max(96, label.length * 6.2);
    const lx = Math.min(Math.max(X - w/2, g.ml), g.W - g.mr - w);
    tRect.setAttribute("x", lx); tRect.setAttribute("width", w);
    tRect.setAttribute("y", g.H - g.mb + 2);
    tText.setAttribute("x", lx + w/2);
    tText.setAttribute("y", g.H - g.mb + 15);
    tText.textContent = label;
  });

  hit.addEventListener("mouseleave", () => { cross.style.display = "none"; });
}

/* ---- ticker search ------------------------------------------------------- */
const qEl = document.getElementById("q"), acEl = document.getElementById("ac");
let acItems = [], acIdx = -1, acTimer = null;

qEl.addEventListener("input", () => {
  clearTimeout(acTimer);
  const term = qEl.value.trim();
  if (!term) return closeAc();
  acTimer = setTimeout(async () => {
    try {
      acItems = await rpc("search_companies", { q: term }) || [];
      acIdx = -1;
      if (!acItems.length) return closeAc();
      acEl.innerHTML = acItems.map((x,i) =>
        `<div role="option" data-i="${i}" aria-selected="false"><b>${esc(x.ticker)}</b><span>${esc(x.name)}</span></div>`).join("");
      acEl.classList.add("open");
      qEl.setAttribute("aria-expanded","true");
    } catch { closeAc(); }
  }, 130);
});
function closeAc(){ acEl.classList.remove("open"); qEl.setAttribute("aria-expanded","false"); acIdx = -1; }
acEl.addEventListener("mousedown", e => {
  const d = e.target.closest("[data-i]");
  if (d) { e.preventDefault(); openCompany(acItems[+d.dataset.i].ticker); }
});
qEl.addEventListener("keydown", e => {
  if (!acEl.classList.contains("open")) {
    if (e.key === "Enter" && qEl.value.trim()) openCompany(qEl.value.trim().toUpperCase());
    return;
  }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    acIdx = (acIdx + (e.key === "ArrowDown" ? 1 : acItems.length - 1)) % acItems.length;
    [...acEl.children].forEach((c,i) => c.setAttribute("aria-selected", i === acIdx));
  } else if (e.key === "Enter") {
    e.preventDefault();
    openCompany((acIdx >= 0 ? acItems[acIdx] : acItems[0]).ticker);
  } else if (e.key === "Escape") closeAc();
});
qEl.addEventListener("blur", () => setTimeout(closeAc, 120));

/* ---- theme --------------------------------------------------------------- */
const themeBtn = document.getElementById("theme");
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "Light" : "Dark";
  try { localStorage.setItem("alphaticker-theme", t); } catch {}
}
themeBtn.onclick = () =>
  setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

/* ---- boot ---------------------------------------------------------------- */
(async function boot(){
  let t = null;
  try { t = localStorage.getItem("alphaticker-theme") || localStorage.getItem("ledger-theme"); } catch {}
  setTheme(t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

  document.querySelectorAll("#views button").forEach(b => b.onclick = () => setView(b.dataset.v));

  document.getElementById("foot").innerHTML =
    `<strong>Prices and movers</strong> come from Financial Modeling Prep and are
     end-of-day for the last completed session, not live quotes.
     <strong>Company financials</strong> — everything on the
     <a href="company.html">company page</a> — come only from SEC filings.
     Two sources, two different questions: what the market did, and what the
     business earned.`;

  if (!HOSTED) {
    document.getElementById("cards").innerHTML =
      `<div class="card" style="grid-column:1/-1"><div class="k">Not configured</div>
       <div class="v" style="font-size:16px">config.js is missing</div>
       <div class="d">This page reads from Supabase and has no local fallback.</div></div>`;
    return;
  }

  try {
    S.overview = await rpc("get_market_overview");
    renderCards(S.overview || {});
  } catch (e) {
    document.getElementById("asof").textContent = "Market data unavailable: " + e.message;
  }
  await setView("market_cap");
})();
</script>
